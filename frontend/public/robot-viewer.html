<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Arm 3D Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #f5f5f5;
        }

        #canvas-container {
            width: 100%;
            height: 100vh;
        }

        #mount-tune,
        #cam2-tune {
            position: absolute;
            left: 12px;
            z-index: 45;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            font: 11px/1.5 system-ui, sans-serif;
            padding: 8px 10px;
            border-radius: 8px;
            display: none;
            flex-direction: column;
            gap: 3px;
        }

        #mount-tune {
            top: 12px;
        }

        #cam2-tune {
            top: 185px;
        }

        #mount-tune label,
        #cam2-tune label {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #mount-tune input[type=range],
        #cam2-tune input[type=range] {
            width: 96px;
        }

        #mount-tune .tune-num,
        #cam2-tune .tune-num {
            width: 62px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 4px;
            font: inherit;
            font-variant-numeric: tabular-nums;
            padding: 1px 4px;
            text-align: right;
        }

        #btn-icp {
            margin-top: 4px;
            padding: 4px 6px;
            border: 0;
            border-radius: 6px;
            background: #2b6cb0;
            color: #fff;
            font: inherit;
            cursor: pointer;
        }

        #btn-panels {
            position: absolute;
            bottom: 12px;
            right: 12px;
            z-index: 46;
            padding: 6px 10px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: transparent;
            font: 12px/1.4 system-ui, sans-serif;
            cursor: pointer;
        }

        #loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(245, 245, 245, 0.90);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #333;
            font-family: system-ui, sans-serif;
            font-size: 13px;
            z-index: 50;
            transition: opacity 0.4s ease;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top-color: #1a8fe3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #hint {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(8px);
            color: rgba(30, 41, 59, 0.9);
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 11px;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            pointer-events: none;
            white-space: normal;
            text-align: center;
            max-width: 90vw;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            z-index: 20;
        }

        #hint span {
            color: #0284c7;
            font-weight: 700;
        }

        /* ── Gizmo Mode Toolbar ── */
        #gizmo-toolbar {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            gap: 6px;
            z-index: 30;
            font-family: system-ui, -apple-system, sans-serif;
            flex-wrap: wrap;
        }

        .gizmo-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(8px);
            color: #1e293b;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
            transition: all 0.15s ease;
            user-select: none;
        }

        .gizmo-btn:hover {
            background: rgba(240, 248, 255, 0.95);
            border-color: #3b82f6;
            color: #1d4ed8;
        }

        .gizmo-btn.active {
            background: #1d4ed8;
            border-color: #1d4ed8;
            color: #fff;
            box-shadow: 0 2px 10px rgba(29, 78, 216, 0.4);
        }

        .gizmo-btn .kbd {
            font-size: 9px;
            padding: 1px 4px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.08);
            color: inherit;
            opacity: 0.7;
        }

        .gizmo-btn.active .kbd {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ── Gizmo Guide Badge ── */
        .gizmo-guide {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            color: #1e293b;
            font-size: 11px;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            user-select: none;
        }

        .guide-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 3px;
            vertical-align: middle;
        }

        .dot-xyz {
            background: #3b82f6;
            box-shadow: 0 0 5px #3b82f6;
        }

        .dot-j4 {
            background: #ef4444;
            box-shadow: 0 0 5px #ef4444;
        }

        .dot-j5 {
            background: #10b981;
            box-shadow: 0 0 5px #10b981;
        }

        .guide-sep {
            color: #cbd5e1;
            font-weight: 300;
        }

        /* Touch: make canvas fill properly on iPad */
        canvas {
            touch-action: none;
            display: block;
        }

        /* Display-only mode (for Drawing page): hides toolbar and hint */
        body.display-only #gizmo-toolbar,
        body.display-only #hint {
            display: none !important;
        }

        @media (max-width: 1024px) {
            #hint {
                font-size: 10px;
                padding: 5px 12px;
                bottom: 8px;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/ColladaLoader.js"></script>
</head>

<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <span>กำลังโหลดโมเดล...</span>
    </div>
    <!-- Gizmo Toolbar -->
    <div id="gizmo-toolbar">
        <button id="btn-snap" class="gizmo-btn gizmo-btn-snap"
            title="Snap Gizmo back to arm tip &amp; capture Ghost Shadow (R)">
            ⊙ Snap เงา <span class="kbd">R</span>
        </button>
        <button id="btn-clear-ghost" class="gizmo-btn gizmo-btn-clear" style="display:none;"
            title="Clear ghost shadow (C)">
            ✖ ลบเงา <span class="kbd">C</span>
        </button>
    </div>

    <!-- Floating tooltip for joint angle during hover / drag -->
    <div id="joint-tooltip"
        style="position:fixed;display:none;pointer-events:none;z-index:9999;background:rgba(15,23,42,0.92);backdrop-filter:blur(6px);color:#fff;font:11px/1.4 system-ui,sans-serif;font-weight:600;padding:5px 9px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.18);">
    </div>

    <div id="canvas-container"></div>

    <div id="mount-tune">
        <div style="font-weight:600;margin-bottom:4px;font-size:11px;color:#9fd3ff;">Cam1 mount (flange → projector)</div>
        <label>X <input type="range" id="mt-px" min="-2" max="2" step="0.001" value="0.04"><input
                type="number" class="tune-num" id="mt-px-n" step="0.001" value="0.04"></label>
        <label>Y <input type="range" id="mt-py" min="-2" max="2" step="0.001" value="0.054"><input
                type="number" class="tune-num" id="mt-py-n" step="0.001" value="0.054"></label>
        <label>Z <input type="range" id="mt-pz" min="-2" max="2" step="0.001" value="0.01"><input
                type="number" class="tune-num" id="mt-pz-n" step="0.001" value="0.01"></label>
        <label>RotX <input type="range" id="mt-rx" min="-180" max="180" step="0.1" value="180"><input
                type="number" class="tune-num" id="mt-rx-n" step="0.1" value="180"></label>
        <label>RotY <input type="range" id="mt-ry" min="-180" max="180" step="0.1" value="0"><input
                type="number" class="tune-num" id="mt-ry-n" step="0.1" value="0"></label>
        <label>RotZ <input type="range" id="mt-rz" min="-180" max="180" step="0.1" value="180"><input
                type="number" class="tune-num" id="mt-rz-n" step="0.1" value="180"></label>
    </div>

    <div id="cam2-tune">
        <div style="font-weight:600;margin-bottom:4px;font-size:11px;color:#9fd3ff;">Cam2 extrinsic (base)</div>
        <label>X <input type="range" id="c2-px" min="-2" max="2" step="0.001" value="0.003"><input
                type="number" class="tune-num" id="c2-px-n" step="0.001" value="0.003"></label>
        <label>Y <input type="range" id="c2-py" min="-2" max="2" step="0.001" value="0.718"><input
                type="number" class="tune-num" id="c2-py-n" step="0.001" value="0.718"></label>
        <label>Z <input type="range" id="c2-pz" min="-2" max="2" step="0.001" value="0.818"><input
                type="number" class="tune-num" id="c2-pz-n" step="0.001" value="0.818"></label>
        <label>RotX <input type="range" id="c2-rx" min="-180" max="180" step="0.1" value="-75"><input
                type="number" class="tune-num" id="c2-rx-n" step="0.1" value="-75"></label>
        <label>RotY <input type="range" id="c2-ry" min="-180" max="180" step="0.1" value="0"><input
                type="number" class="tune-num" id="c2-ry-n" step="0.1" value="0"></label>
        <label>RotZ <input type="range" id="c2-rz" min="-180" max="180" step="0.1" value="0"><input
                type="number" class="tune-num" id="c2-rz-n" step="0.1" value="0"></label>
        <button id="btn-icp" type="button">Align (ICP)</button>
        <button id="btn-color" type="button">Color: Video</button>
        <label>พื้นที่ cam
            <select id="sel-area-cam">
                <option value="1" selected>cam1</option>
                <option value="2">cam2</option>
            </select>
        </label>
        <button id="btn-area" type="button">📐 วัดพื้นที่วัตถุ</button>
        <div id="area-result" style="font-size:10px;color:#9fd3ff;white-space:pre-line;max-width:220px;"></div>
        <div id="cam-pos" style="font-size:10px;color:#ffd28a;white-space:pre-line;max-width:220px;"></div>
        <div style="border-top:1px solid rgba(255,255,255,0.15);margin-top:5px;padding-top:5px;font-size:10px;color:#9fd3ff;">
            <div>Planar calibrate (depth-free)</div>
            <div style="display:flex;gap:4px;margin:3px 0;">
                <button id="btn-calib-refresh" type="button" style="font:inherit;">↻ ภาพ</button>
                <button id="btn-calib-reset" type="button" style="font:inherit;">reset</button>
            </div>
            <img id="calib-img" alt="คลิกจุดที่หุ่นแตะ"
                style="width:210px;height:auto;cursor:crosshair;border:1px solid rgba(255,255,255,0.25);background:#05070a;" />
            <div id="calib-status" style="white-space:pre-line;margin-top:2px;"></div>
            <div style="display:flex;gap:4px;margin-top:3px;">
                <button id="btn-bg" type="button" style="font:inherit;">📷 เก็บพื้นหลัง</button>
                <button id="btn-area-h" type="button" style="font:inherit;">📐 พื้นที่ (H)</button>
            </div>
            <div id="area-h-result" style="white-space:pre-line;color:#9fd3ff;"></div>
        </div>
        <label>3D mode
            <select id="sel-mode">
                <option value="auto" selected>Auto (ตามกล้อง)</option>
                <option value="rgb">RGB</option>
                <option value="gray">Gray</option>
                <option value="depth">Depth</option>
            </select>
        </label>
        <label><input type="checkbox" id="chk-auto" checked> Auto-align (ยึดตาม cam2)</label>
        <label><input type="checkbox" id="chk-mark1"> แสดง cam1 marker</label>
        <label><input type="checkbox" id="chk-mark2"> แสดง cam2 marker</label>
        <label><input type="checkbox" id="chk-mesh1" checked> แสดง mesh cam1</label>
        <label><input type="checkbox" id="chk-cloud1"> แสดง cloud cam1</label>
        <label><input type="checkbox" id="chk-mesh2" checked> แสดง mesh cam2</label>
        <label><input type="checkbox" id="chk-cloud2"> แสดง cloud cam2</label>
    </div>

    <div class="panel" id="scan-panel" style="margin-top:8px">
        <div style="font-weight:600;margin-bottom:6px">Scan &amp; Fuse</div>
        <label><input type="checkbox" id="chk-scanlive"> Live fused (2 กล้อง)</label>
        <div style="display:flex;gap:6px;margin:6px 0">
            <button type="button" id="btn-cap1">+ cam1</button>
            <button type="button" id="btn-cap2">+ cam2</button>
        </div>
        <div id="scan-count" style="font-size:12px;opacity:.8">views: 0</div>
        <div id="ext-status" style="font-size:11px;opacity:.8">cam2 extrinsic: —</div>
        <div style="display:flex;gap:6px;margin:6px 0">
            <button type="button" id="btn-fuse">Fuse</button>
            <button type="button" id="btn-save">Save</button>
            <button type="button" id="btn-clear">Clear</button>
        </div>
        <select id="sel-session" style="width:100%"></select>
        <button type="button" id="btn-load" style="width:100%;margin-top:6px">Load session</button>
    </div>

    <div style="display:flex;gap:6px;margin-top:8px">
        <button id="btn-panels" type="button">⚙ Tune</button>
        <button id="btn-tune-cam1" type="button">Cam1</button>
    </div>

    <script>
        // Check view/display mode from URL query (?mode=display or ?display=1)
        const urlParams = new URLSearchParams(window.location.search);
        const isDisplayOnly = urlParams.get('mode') === 'display' || urlParams.has('display') || urlParams.has('minimal') || urlParams.has('viewonly');
        if (isDisplayOnly) {
            document.body.classList.add('display-only');
        }

        // ===== 1. Scene, Camera, Renderer =====
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f5f5);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(1.8, 1.8, 2.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.localClippingEnabled = true;
        container.appendChild(renderer.domElement);
        const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0.0);

        const cameraControls = new THREE.OrbitControls(camera, renderer.domElement);
        cameraControls.enableDamping = true;
        cameraControls.dampingFactor = 0.05;
        cameraControls.target.set(0, 0.4, 0);

        // Lighting
        scene.add(new THREE.HemisphereLight(0xffffff, 0xd8e0ea, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(3, 6, 4);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(2048, 2048);
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 20;
        dirLight.shadow.camera.left = -2;
        dirLight.shadow.camera.right = 2;
        dirLight.shadow.camera.top = 2;
        dirLight.shadow.camera.bottom = -2;
        dirLight.shadow.bias = -0.0005;
        dirLight.shadow.radius = 3;
        scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0xcfe0ff, 0.5);
        fillLight.position.set(-4, 3, -3);
        scene.add(fillLight);

        const pmrem = new THREE.PMREMGenerator(renderer);
        const envCanvas = document.createElement('canvas');
        envCanvas.width = 256; envCanvas.height = 128;
        const envCtx = envCanvas.getContext('2d');
        const envGrad = envCtx.createLinearGradient(0, 0, 0, 128);
        envGrad.addColorStop(0.0, '#ffffff');
        envGrad.addColorStop(0.5, '#eaeff5');
        envGrad.addColorStop(1.0, '#b6c1cc');
        envCtx.fillStyle = envGrad;
        envCtx.fillRect(0, 0, 256, 128);
        const envTex = new THREE.CanvasTexture(envCanvas);
        envTex.mapping = THREE.EquirectangularReflectionMapping;
        scene.environment = pmrem.fromEquirectangular(envTex).texture;
        envTex.dispose();
        pmrem.dispose();

        // Grid + soft shadow catcher
        const gridHelper = new THREE.GridHelper(3, 15, 0xbbbbbb, 0xdddddd);
        scene.add(gridHelper);
        const axesHelper = new THREE.AxesHelper(0.4);
        scene.add(axesHelper);
        const shadowPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(6, 6),
            new THREE.ShadowMaterial({ opacity: 0.22 }));
        shadowPlane.rotation.x = -Math.PI / 2;
        shadowPlane.receiveShadow = true;
        scene.add(shadowPlane);

        // ===== Camera Feed Ground Plane =====
        const camCanvas = document.createElement('canvas');
        camCanvas.width = 640;
        camCanvas.height = 360;
        const camCtx = camCanvas.getContext('2d');
        const camTexture = new THREE.CanvasTexture(camCanvas);
        camTexture.minFilter = THREE.LinearFilter;
        camTexture.magFilter = THREE.LinearFilter;

        const cam2Canvas = document.createElement('canvas');
        cam2Canvas.width = 640;
        cam2Canvas.height = 360;
        const cam2Ctx = cam2Canvas.getContext('2d');
        const cam2Texture = new THREE.CanvasTexture(cam2Canvas);
        cam2Texture.minFilter = THREE.LinearFilter;
        cam2Texture.magFilter = THREE.LinearFilter;

        const depthCanvas = document.createElement('canvas');
        depthCanvas.width = 160;
        depthCanvas.height = 90;
        const depthCtx = depthCanvas.getContext('2d');
        const depthTexture = new THREE.CanvasTexture(depthCanvas);
        depthTexture.minFilter = THREE.LinearFilter;
        depthTexture.magFilter = THREE.LinearFilter;

        function readDepthFrame() {
            if (isDisplayOnly || !cloudVisible('chk-mesh1')) return;
            const token = localStorage.getItem('access_token') || '';
            if (!token) { setTimeout(readDepthFrame, 2000); return; }
            fetch('/api/map/depth_frame?_t=' + Date.now(), {
                headers: { Authorization: 'Bearer ' + token },
                cache: 'no-store',
            }).then((res) => { if (!res.ok) throw 0; return res.blob(); })
                .then((blob) => createImageBitmap(blob))
                .then((bmp) => {
                    depthCtx.drawImage(bmp, 0, 0, depthCanvas.width, depthCanvas.height);
                    bmp.close();
                    depthTexture.needsUpdate = true;
                })
                .catch(() => { })
                .finally(() => { setTimeout(readDepthFrame, 120); });
        }
        readDepthFrame();

        function findSeq(buf, seq, from) {
            const n = seq.length;
            for (let i = from; i <= buf.length - n; i++) {
                let ok = true;
                for (let j = 0; j < n; j++) { if (buf[i + j] !== seq[j]) { ok = false; break; } }
                if (ok) return i;
            }
            return -1;
        }

        function catBuf(a, b) {
            if (a.length === 0) return b;
            const out = new Uint8Array(a.length + b.length);
            out.set(a, 0); out.set(b, a.length);
            return out;
        }

        function drawJpeg(jpeg) {
            createImageBitmap(new Blob([jpeg], { type: 'image/jpeg' })).then((bmp) => {
                if (camCanvas.width !== bmp.width || camCanvas.height !== bmp.height) {
                    camCanvas.width = bmp.width; camCanvas.height = bmp.height;
                }
                camCtx.drawImage(bmp, 0, 0);
                bmp.close();
                camTexture.needsUpdate = true;
            }).catch(() => { });
        }

        function readCamStream() {
            if (isDisplayOnly) return;
            const token = localStorage.getItem('access_token') || '';
            if (!token) { setTimeout(readCamStream, 2000); return; }
            fetch('/api/map/video_feed?_t=' + Date.now(), {
                headers: { Authorization: 'Bearer ' + token },
                cache: 'no-store',
            }).then((res) => {
                if (!res.ok || !res.body) throw new Error('stream ' + res.status);
                const reader = res.body.getReader();
                let buf = new Uint8Array(0);
                const pump = () => reader.read().then(({ value, done }) => {
                    if (done) return;
                    buf = catBuf(buf, value);
                    // Real-time: keep ONLY the last complete JPEG in this batch
                    // and drop the older ones. Drawing every buffered frame made
                    // the texture replay stale frames, so lag grew the longer a
                    // stream ran (TCP buffer + decode backlog).
                    let pos = 0, last = null;
                    for (; ;) {
                        const soi = findSeq(buf, [0xff, 0xd8], pos);
                        if (soi < 0) { pos = Math.max(0, buf.length - 1); break; }
                        const eoi = findSeq(buf, [0xff, 0xd9], soi + 2);
                        if (eoi < 0) { pos = soi; break; }
                        last = buf.subarray(soi, eoi + 2);
                        pos = eoi + 2;
                    }
                    if (last) drawJpeg(last);
                    if (pos > 0) buf = buf.subarray(pos);
                    return pump();
                });
                return pump();
            }).catch(() => { setTimeout(readCamStream, 1000); });
        }
        readCamStream();

        function drawJpeg2(jpeg) {
            createImageBitmap(new Blob([jpeg], { type: 'image/jpeg' })).then((bmp) => {
                if (cam2Canvas.width !== bmp.width || cam2Canvas.height !== bmp.height) {
                    cam2Canvas.width = bmp.width; cam2Canvas.height = bmp.height;
                }
                cam2Ctx.drawImage(bmp, 0, 0);
                bmp.close();
                cam2Texture.needsUpdate = true;
            }).catch(() => { });
        }

        function readCam2Stream() {
            if (isDisplayOnly) return;

            const b = Math.min(1, Math.max(0, 1.5 - Math.abs(4 * t - 1)));

                    const l = (0.299 * rgb[j] + 0.587 * rgb[j + 1] + 0.114 * rgb[j + 2]) / 255;
                    colArr[j] = l; colArr[j + 1] = l; colArr[j + 2] = l;
                }
                return;
            }
            if (mode === 'depth') {
                let dmin = Infinity, dmax = -Infinity;
                for (let i = 0; i < count; i++) {
                    const d = -posArr[i * 3 + 2];
                    if (d < dmin) dmin = d;
                    if (d > dmax) dmax = d;
                }
                const span = Math.max(dmax - dmin, 0.05);
                for (let i = 0; i < count; i++) {
                    const t = Math.min(1, Math.max(0, (-posArr[i * 3 + 2] - dmin) / span));
                    const c = turboColor(t);
                    colArr[i * 3] = c[0]; colArr[i * 3 + 1] = c[1]; colArr[i * 3 + 2] = c[2];
                }
                return;

            for (let i = 0; i < count; i++) {

                colArr[j] = rgb[j] / 255;
                colArr[j + 1] = rgb[j + 1] / 255;
                colArr[j + 2] = rgb[j + 2] / 255;

            }
        }
        for (let j = 0; j < MESH2_H - 1; j++) {
            for (let i = 0; i < MESH2_W - 1; i++) {
                const a = j * MESH2_W + i;
                const b = a + 1;
                const c = a + MESH2_W;
                const e = c + 1;
                mesh2Indices.push(a, c, b, b, c, e);
            }
        }
        const mesh2Geo = new THREE.BufferGeometry();
        const mesh2PosAttr = new THREE.BufferAttribute(mesh2Pos, 3);
        mesh2PosAttr.setUsage(THREE.DynamicDrawUsage);
        mesh2Geo.setAttribute('position', mesh2PosAttr);
        mesh2Geo.setAttribute('uv', new THREE.BufferAttribute(mesh2Uv, 2));
        const mesh2ValAttr = new THREE.BufferAttribute(mesh2Valid, 1);
        mesh2ValAttr.setUsage(THREE.DynamicDrawUsage);
        mesh2Geo.setAttribute('aValid', mesh2ValAttr);
        mesh2Geo.setIndex(mesh2Indices);
        const mesh2Mat = new THREE.ShaderMaterial({
            uniforms: { map: { value: cam2Texture } },
            vertexShader: [
                'attribute float aValid;',
                'varying float vValid;',
                'varying vec2 vUv;',
                'void main() {',
                '  vUv = uv;',
                '  vValid = aValid;',
                '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
                '}',
            ].join('\n'),
            fragmentShader: [
                'uniform sampler2D map;',
                'varying float vValid;',
                'varying vec2 vUv;',
                'void main() {',
                '  if (vValid < 0.99) discard;',
                '  gl_FragColor = texture2D(map, vUv);',
                '}',
            ].join('\n'),
            side: THREE.DoubleSide,
        });
        const depthMesh2 = new THREE.Mesh(mesh2Geo, mesh2Mat);
        depthMesh2.frustumCulled = false;
        cam2Mount.add(depthMesh2);

        function readDepthGrid2() {
            if (isDisplayOnly || !cloudVisible('chk-mesh2')) return;
            const token = localStorage.getItem('access_token') || '';
            if (!token) { setTimeout(readDepthGrid2, 2000); return; }
            fetch('/api/camera/depth_grid2?_t=' + Date.now(), {
                headers: { Authorization: 'Bearer ' + token },
                cache: 'no-store',
            }).then((r) => (r.ok ? r.arrayBuffer() : null))
                .then((ab) => {
                    if (!ab || ab.byteLength < 4) return;
                    const dv = new DataView(ab);
                    const w = dv.getUint16(0, true);
                    const h = dv.getUint16(2, true);
                    if (w !== MESH2_W || h !== MESH2_H) return;
                    const d = new Uint16Array(ab, 4, w * h);
                    const MAXMM = 1200;
                    const JUMP = 80;
                    const fx = camIntr.fx, fy = camIntr.fy, cx = camIntr.cx, cy = camIntr.cy;
                    const iw = camIntr.w, ih = camIntr.h;
                    for (let j = 0; j < h; j++) {
                        for (let i = 0; i < w; i++) {
                            const k = j * w + i;
                            const zmm = d[k];
                            let ok = zmm > 0 && zmm < MAXMM;
                            if (ok && i > 0 && d[k - 1] > 0 && Math.abs(zmm - d[k - 1]) > JUMP) ok = false;
                            if (ok && j > 0 && d[k - w] > 0 && Math.abs(zmm - d[k - w]) > JUMP) ok = false;
                            if (ok && i < w - 1 && d[k + 1] > 0 && Math.abs(zmm - d[k + 1]) > JUMP) ok = false;
                            if (ok && j < h - 1 && d[k + w] > 0 && Math.abs(zmm - d[k + w]) > JUMP) ok = false;
                            const z = (ok ? zmm : 500) / 1000.0;
                            const px = ((i + 0.5) / w) * iw;
                            const py = ((j + 0.5) / h) * ih;
                            mesh2Pos[k * 3] = (px - cx) / fx * z;
                            mesh2Pos[k * 3 + 1] = -((py - cy) / fy * z);
                            mesh2Pos[k * 3 + 2] = -z;
                            mesh2Valid[k] = ok ? 1 : 0;
                        }
                    }
                    mesh2PosAttr.needsUpdate = true;
                    mesh2ValAttr.needsUpdate = true;
                })
                .catch(() => { })
                .finally(() => { setTimeout(readDepthGrid2, 100); });
        }
        readDepthGrid2();

        const cam2MarkerMat = new THREE.MeshStandardMaterial({
            color: 0xff5522,
            emissive: 0xaa2200,
            emissiveIntensity: 0.6,
            metalness: 0.2,
            roughness: 0.5,

        const cam2Marker = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.1, 16), cam2MarkerMat);
        cam2Marker.rotation.x = -Math.PI / 2;
        cam2Mount.add(cam2Marker);

        const cam2LabelCanvas = document.createElement('canvas');

        function readPointCloud2() {
            if (!cloudVisible('chk-cloud2')) return;
            fetchCloudBinary('/api/camera/pointcloud2', 0)
                .then(({ n, mm, rgb }) => {
                    if (!n) return;
                    const count = Math.min(n, CAM2_MAX_PTS);
                    fillCloudPositions(cam2Pos, mm, count);
                    setCloudColors(cam2Col, cam2Pos, count, rgb, effMode(2));
                    cam2Geo.setDrawRange(0, count);
                    cam2PosAttr.needsUpdate = true;
                    cam2ColAttr.needsUpdate = true;
                })
                .catch(() => { })
                .finally(() => { setTimeout(readPointCloud2, 800); });
        }
        readPointCloud2();

        // ===== Scan / Fuse (cam2 static + cam1 multi-view) =====
        const SCAN_MAX_PTS = 40000;
        const scanPos = new Float32Array(SCAN_MAX_PTS * 3);
        const scanCol = new Float32Array(SCAN_MAX_PTS * 3);
        const scanGeo = new THREE.BufferGeometry();
        const scanPosAttr = new THREE.BufferAttribute(scanPos, 3);
        scanPosAttr.setUsage(THREE.DynamicDrawUsage);
        const scanColAttr = new THREE.BufferAttribute(scanCol, 3);
        scanColAttr.setUsage(THREE.DynamicDrawUsage);
        scanGeo.setAttribute('position', scanPosAttr);
        scanGeo.setAttribute('color', scanColAttr);
        const scanMat = new THREE.PointsMaterial({ size: 0.006, vertexColors: true });
        const scanPoints = new THREE.Points(scanGeo, scanMat);
        scanPoints.visible = false;
        scene.add(scanPoints);

        function fillScanCloud(mm, rgb, count) {
            for (let i = 0; i < count; i++) {
                const j = i * 3;
                scanPos[j] = mm[j] / 1000.0;
                scanPos[j + 1] = -mm[j + 1] / 1000.0;
                scanPos[j + 2] = -mm[j + 2] / 1000.0;
                scanCol[j] = rgb[j] / 255.0;
                scanCol[j + 1] = rgb[j + 1] / 255.0;
                scanCol[j + 2] = rgb[j + 2] / 255.0;
            }
            scanGeo.setDrawRange(0, count);
            scanPosAttr.needsUpdate = true;
            scanColAttr.needsUpdate = true;
        }

        function parseScanCloud(ab) {
            if (ab.byteLength < 4) return null;
            const n = new DataView(ab).getUint32(0, true);
            if (!n) return null;
            return {
                n, mm: new Int16Array(ab, 4, n * 3),
                rgb: new Uint8Array(ab, 4 + n * 6, n * 3),
            };
        }

        let scanWs = null;
        function connectScanLive() {
            const token = localStorage.getItem('access_token') || '';
            if (!token) { setTimeout(connectScanLive, 2000); return; }
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            scanWs = new WebSocket(proto + '//' + location.host + '/api/scan/ws?token=' + encodeURIComponent(token));
            scanWs.binaryType = 'arraybuffer';
            scanWs.onmessage = (ev) => {
                const c = parseScanCloud(ev.data);
                if (!c) return;
                const count = Math.min(c.n, SCAN_MAX_PTS);
                fillScanCloud(c.mm, c.rgb, count);
            };
            scanWs.onclose = () => {
                scanWs = null;
                if (document.getElementById('chk-scanlive')?.checked) setTimeout(connectScanLive, 1000);
            };
        }

        const scanAuth = () => ({ Authorization: 'Bearer ' + (localStorage.getItem('access_token') || '') });

        function bindTunePair(prefix, id) {
            const slider = document.getElementById(prefix + id);
            const num = document.getElementById(prefix + id + '-n');
            if (!slider || !num) return;
            slider.addEventListener('input', () => { num.value = slider.value; });
            num.addEventListener('input', () => {

                if (Number.isFinite(v)) slider.value = String(v);
            });
        }

        function bindCam2Tune() {
            const ids = ['px', 'py', 'pz', 'rx', 'ry', 'rz'];
            const get = (id) => document.getElementById('c2-' + id);
            let saveTimer = null;
            const apply = () => {
                const rad = Math.PI / 180;
                cam2Mount.position.set(+get('px').value, +get('py').value, +get('pz').value);
                cam2Mount.rotation.set(
                    +get('rx').value * rad,
                    +get('ry').value * rad,
                    +get('rz').value * rad);
                clearTimeout(saveTimer);
                saveTimer = setTimeout(saveCam2Extrinsic, 400);
            };
            ids.forEach((id) => {
                bindTunePair('c2-', id);
                const el = get(id);
                if (el) el.addEventListener('input', apply);
                const num = document.getElementById('c2-' + id + '-n');
                if (num) num.addEventListener('input', apply);
            });
            apply();
        }
        bindCam2Tune();

        // Persist the viewer's cam2 mount tune to /api/scan/extrinsics so fuse
        // and the live fused stream use the same transform the operator tuned.
        async function saveCam2Extrinsic() {
            const get = (id) => document.getElementById('c2-' + id);
            const body = { cam2_to_base: {
                xyz: [+get('px').value, +get('py').value, +get('pz').value],
                rpy: [+get('rx').value, +get('ry').value, +get('rz').value],
            } };
            try {
                await fetch('/api/scan/extrinsics', {
                    method: 'POST', headers: { ...scanAuth(), 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                const el = document.getElementById('ext-status');
                if (el) el.textContent = 'cam2 extrinsic: saved ✓';
            } catch { /* ignore */ }
        }

        async function loadCam2Extrinsic() {
            try {
                const r = await fetch('/api/scan/extrinsics', { headers: scanAuth() });
                const d = await r.json();
                const ex = d.extrinsics && d.extrinsics.cam2_to_base;
                if (!ex || !ex.xyz || !ex.rpy) return;
                const set = (id, v) => {
                    const el = document.getElementById('c2-' + id);
                    if (el) el.value = String(Number(v).toFixed(3));
                    const num = document.getElementById('c2-' + id + '-n');
                    if (num) num.value = String(Number(v).toFixed(3));
                };
                set('px', ex.xyz[0]); set('py', ex.xyz[1]); set('pz', ex.xyz[2]);
                set('rx', ex.rpy[0]); set('ry', ex.rpy[1]); set('rz', ex.rpy[2]);
                const rad = Math.PI / 180;
                cam2Mount.position.set(+ex.xyz[0], +ex.xyz[1], +ex.xyz[2]);
                cam2Mount.rotation.set(+ex.rpy[0] * rad, +ex.rpy[1] * rad, +ex.rpy[2] * rad);
                const el = document.getElementById('ext-status');
                if (el) el.textContent = 'cam2 extrinsic: loaded';
            } catch { /* ignore */ }
        }
        loadCam2Extrinsic();

        function worldCloud(obj, localArr, count, stride) {
            obj.updateWorldMatrix(true, false);
            const m = obj.matrixWorld;
            const v = new THREE.Vector3();
            const out = [];
            for (let i = 0; i < count; i += stride) {
                v.set(localArr[i * 3], localArr[i * 3 + 1], localArr[i * 3 + 2]).applyMatrix4(m);
                out.push([v.x, v.y, v.z]);
            }
            return out;
        }

        function syncMountSliders(mount, prefix) {
            const deg = (r) => (r * 180) / Math.PI;
            const vals = {
                px: mount.position.x, py: mount.position.y, pz: mount.position.z,
                rx: deg(mount.rotation.x), ry: deg(mount.rotation.y), rz: deg(mount.rotation.z),
            };
            Object.keys(vals).forEach((id) => {
                const el = document.getElementById(prefix + id);
                if (!el) return;
                const v = String(Math.round(vals[id] * 1000) / 1000);
                el.value = v;
                const num = document.getElementById(prefix + id + '-n');
                if (num) num.value = v;
            });
        }

        let icpBusy = false;
        let alignGoalP = null;
        let alignGoalQ = null;
        let alignStable = 0;
        const ARM_STILL_MS = 1200;
        const _lastParentWorld = new THREE.Matrix4();
        let _lastParentMove = performance.now();

        function trackArmStill() {
            const p = projectorMount.parent;
            if (!p) return;
            p.updateWorldMatrix(true, false);
            const a = p.matrixWorld.elements;
            const b = _lastParentWorld.elements;
            let moved = false;
            for (let i = 0; i < 16; i++) {
                if (Math.abs(a[i] - b[i]) > 1e-6) { moved = true; break; }
            }
            if (moved) {
                _lastParentMove = performance.now();
                _lastParentWorld.copy(p.matrixWorld);
            }
        }

        function matClose(m, ref, eps) {
            const a = m.elements;
            const b = ref.elements;
            for (let i = 0; i < 16; i++) {
                if (Math.abs(a[i] - b[i]) > eps) return false;
            }
            return true;
        }

        function applyAlignTarget() {
            if (alignGoalP === null) return;
            projectorMount.position.lerp(alignGoalP, 0.12);
            projectorMount.quaternion.slerp(alignGoalQ, 0.12);
            projectorMount.updateMatrixWorld(true);
            const dp = projectorMount.position.distanceTo(alignGoalP);
            const dq = 1 - Math.abs(projectorMount.quaternion.dot(alignGoalQ));
            if (dp < 0.0005 && dq < 1e-6) {
                projectorMount.position.copy(alignGoalP);
                projectorMount.quaternion.copy(alignGoalQ);
                projectorMount.updateMatrixWorld(true);
                alignGoalP = null;
                alignGoalQ = null;
                syncMountSliders(projectorMount, 'mt-');
            }
        }
        // Server-side auto-align: the backend runs ICP continuously (cam2->base)
        // and pushes the result over /ws/align — this page only applies what
        // arrives, no per-tick HTTP. The result updates cam2Mount directly
        // (it IS cam2_to_base), syncs the tune sliders and persists it.
        let alignWs = null;
        let alignWsTimer = null;
        let alignLastP = null;
        let alignLastQ = null;
        let cam2GoalP = null;
        let cam2GoalQ = null;

        function applyAlignMsg(d) {
            if (!d || d.fitness == null || d.fitness < 0.5 || d.rmse > 0.02) return;
            const rad = Math.PI / 180;
            const p = new THREE.Vector3(d.xyz[0], d.xyz[1], d.xyz[2]);
            const q = new THREE.Quaternion().setFromEuler(
                new THREE.Euler(d.rpy[0] * rad, d.rpy[1] * rad, d.rpy[2] * rad));
            if (alignLastP) {
                const dp = alignLastP.distanceTo(p);
                const dq = 1 - Math.abs(alignLastQ.dot(q));
                if (dp < 0.008 && dq < 2e-4) {
                    alignStable++;
                    if (alignStable >= 3) {
                        alignStable = 0;
                        if (autoChk && autoChk.checked) autoChk.checked = false;
                        setAuto(false);
                    }
                    return;
                }
                alignStable = 0;
            }
            alignLastP = p.clone();
            alignLastQ = q.clone();
            cam2GoalP = p;
            cam2GoalQ = q;
        }

        function glideCam2Align() {
            if (cam2GoalP === null) return;
            cam2Mount.position.lerp(cam2GoalP, 0.12);
            cam2Mount.quaternion.slerp(cam2GoalQ, 0.12);
            const dp = cam2Mount.position.distanceTo(cam2GoalP);
            const dq = 1 - Math.abs(cam2Mount.quaternion.dot(cam2GoalQ));
            if (dp < 0.0005 && dq < 1e-6) {
                cam2Mount.position.copy(cam2GoalP);
                cam2Mount.quaternion.copy(cam2GoalQ);
                cam2GoalP = null;
                cam2GoalQ = null;
                syncMountSliders(cam2Mount, 'c2-');
                saveCam2Extrinsic();
            }
        }

        function connectAlignWs() {
            const token = localStorage.getItem('access_token') || '';
            if (!token) { alignWsTimer = setTimeout(connectAlignWs, 2000); return; }
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            try {
                alignWs = new WebSocket(proto + '//' + location.host + '/api/scan/ws/align?token=' + encodeURIComponent(token));
            } catch (err) {
                alignWsTimer = setTimeout(connectAlignWs, 2000);
                return;
            }
            alignWs.onmessage = (ev) => {
                let d = null;
                try { d = JSON.parse(ev.data); } catch (err) { return; }
                applyAlignMsg(d);
            };
            alignWs.onclose = () => {
                alignWs = null;
                if (autoChk && autoChk.checked) alignWsTimer = setTimeout(connectAlignWs, 1000);
            };
        }

        const icpBtn = document.getElementById('btn-icp');

        function setAuto(on) {

        const mesh1Chk = document.getElementById('chk-mesh1');

        const mesh2Chk = document.getElementById('chk-mesh2');

                .catch(() => { });

        const areaHBtn = document.getElementById('btn-area-h');

        refreshCalibStatus();

        const selMode = document.getElementById('sel-mode');
        if (selMode) selMode.addEventListener('change', () => {

        function pollCameraModes() {
            const token = localStorage.getItem('access_token') || '';
            if (!token) { setTimeout(pollCameraModes, 2000); return; }
            fetch('/api/camera/mode', { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' })

                .then((d) => { if (d && d.mode !== undefined) camMode1 = d.mode; })

            fetch('/api/camera/mode2', { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' })

                .then((d) => { if (d && d.mode !== undefined) camMode2 = d.mode; })
                .catch(() => { });
