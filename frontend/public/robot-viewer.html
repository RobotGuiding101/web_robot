<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Arm 3D Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #f5f5f5;
        }

        #canvas-container {
            width: 100%;
            height: 100vh;
        }

        #mount-tune,
        #cam2-tune {
            position: absolute;
            left: 12px;
            z-index: 45;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            font: 11px/1.5 system-ui, sans-serif;
            padding: 8px 10px;
            border-radius: 8px;
            display: none;
            flex-direction: column;
            gap: 3px;
        }

        #mount-tune {
            top: 12px;
        }

        #cam2-tune {
            top: 185px;
        }

        #mount-tune label,
        #cam2-tune label {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #mount-tune input[type=range],
        #cam2-tune input[type=range] {
            width: 110px;
        }

        #btn-icp {
            margin-top: 4px;
            padding: 4px 6px;
            border: 0;
            border-radius: 6px;
            background: #2b6cb0;
            color: #fff;
            font: inherit;
            cursor: pointer;
        }

        #btn-panels {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 46;
            padding: 6px 10px;
            border: 0;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            font: 12px/1.4 system-ui, sans-serif;
            cursor: pointer;
        }

        #loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(245, 245, 245, 0.90);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #333;
            font-family: system-ui, sans-serif;
            font-size: 13px;
            z-index: 50;
            transition: opacity 0.4s ease;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top-color: #1a8fe3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #hint {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(8px);
            color: rgba(30, 41, 59, 0.9);
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 11px;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            pointer-events: none;
            white-space: normal;
            text-align: center;
            max-width: 90vw;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            z-index: 20;
        }

        #hint span {
            color: #0284c7;
            font-weight: 700;
        }

        /* ── Gizmo Mode Toolbar ── */
        #gizmo-toolbar {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            gap: 6px;
            z-index: 30;
            font-family: system-ui, -apple-system, sans-serif;
            flex-wrap: wrap;
        }

        .gizmo-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(8px);
            color: #1e293b;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
            transition: all 0.15s ease;
            user-select: none;
        }

        .gizmo-btn:hover {
            background: rgba(240, 248, 255, 0.95);
            border-color: #3b82f6;
            color: #1d4ed8;
        }

        .gizmo-btn.active {
            background: #1d4ed8;
            border-color: #1d4ed8;
            color: #fff;
            box-shadow: 0 2px 10px rgba(29, 78, 216, 0.4);
        }

        .gizmo-btn .kbd {
            font-size: 9px;
            padding: 1px 4px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.08);
            color: inherit;
            opacity: 0.7;
        }

        .gizmo-btn.active .kbd {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ── Gizmo Guide Badge ── */
        .gizmo-guide {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            color: #1e293b;
            font-size: 11px;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            user-select: none;
        }

        .guide-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 3px;
            vertical-align: middle;
        }

        .dot-xyz {
            background: #3b82f6;
            box-shadow: 0 0 5px #3b82f6;
        }

        .dot-j4 {
            background: #ef4444;
            box-shadow: 0 0 5px #ef4444;
        }

        .dot-j5 {
            background: #10b981;
            box-shadow: 0 0 5px #10b981;
        }

        .guide-sep {
            color: #cbd5e1;
            font-weight: 300;
        }

        /* Touch: make canvas fill properly on iPad */
        canvas {
            touch-action: none;
            display: block;
        }

        /* Display-only mode (for Drawing page): hides toolbar and hint */
        body.display-only #gizmo-toolbar,
        body.display-only #hint {
            display: none !important;
        }

        @media (max-width: 1024px) {
            #hint {
                font-size: 10px;
                padding: 5px 12px;
                bottom: 8px;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/ColladaLoader.js"></script>
</head>

<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <span>กำลังโหลดโมเดล...</span>
    </div>
    <!-- Gizmo Toolbar -->
    <div id="gizmo-toolbar">
        <button id="btn-snap" class="gizmo-btn gizmo-btn-snap"
            title="Snap Gizmo back to arm tip &amp; capture Ghost Shadow (R)">
            ⊙ Snap เงา <span class="kbd">R</span>
        </button>
        <button id="btn-clear-ghost" class="gizmo-btn gizmo-btn-clear" style="display:none;"
            title="Clear ghost shadow (C)">
            ✖ ลบเงา <span class="kbd">C</span>
        </button>
    </div>

    <!-- Floating tooltip for joint angle during hover / drag -->
    <div id="joint-tooltip"
        style="position:fixed;display:none;pointer-events:none;z-index:9999;background:rgba(15,23,42,0.92);backdrop-filter:blur(6px);color:#fff;font:11px/1.4 system-ui,sans-serif;font-weight:600;padding:5px 9px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.18);">
    </div>

    <div id="canvas-container"></div>

    <div id="mount-tune">
        <label>X <input type="range" id="mt-px" min="-2" max="2" step="0.05" value="0"><span
                id="mt-px-v">0</span></label>
        <label>Y <input type="range" id="mt-py" min="-2" max="2" step="0.05" value="0"><span
                id="mt-py-v">0</span></label>
        <label>Z <input type="range" id="mt-pz" min="-2" max="2" step="0.01" value="-0.02"><span
                id="mt-pz-v">-0.02</span></label>
        <label>RotX <input type="range" id="mt-rx" min="-180" max="180" step="5" value="180"><span
                id="mt-rx-v">180</span></label>
        <label>RotY <input type="range" id="mt-ry" min="-180" max="180" step="5" value="0"><span
                id="mt-ry-v">0</span></label>
        <label>RotZ <input type="range" id="mt-rz" min="-180" max="180" step="5" value="180"><span
                id="mt-rz-v">180</span></label>
    </div>

    <div id="cam2-tune">
        <label>X <input type="range" id="c2-px" min="-2" max="2" step="0.05" value="-0.05"><span
                id="c2-px-v">-0.05</span></label>
        <label>Y <input type="range" id="c2-py" min="-2" max="2" step="0.05" value="0.75"><span
                id="c2-py-v">0.75</span></label>
        <label>Z <input type="range" id="c2-pz" min="-2" max="2" step="0.05" value="0.75"><span
                id="c2-pz-v">0.75</span></label>
        <label>RotX <input type="range" id="c2-rx" min="-180" max="180" step="5" value="-75"><span
                id="c2-rx-v">-75</span></label>
        <label>RotY <input type="range" id="c2-ry" min="-180" max="180" step="5" value="0"><span
                id="c2-ry-v">0</span></label>
        <label>RotZ <input type="range" id="c2-rz" min="-180" max="180" step="5" value="0"><span
                id="c2-rz-v">0</span></label>
        <button id="btn-icp" type="button">Align (ICP)</button>
        <button id="btn-color" type="button">Color: Video</button>
        <label>3D mode
            <select id="sel-mode">
                <option value="auto" selected>Auto (ตามกล้อง)</option>
                <option value="rgb">RGB</option>
                <option value="gray">Gray</option>
                <option value="depth">Depth</option>
            </select>
        </label>
        <label><input type="checkbox" id="chk-auto" checked> Auto-align (ยึดตาม cam2)</label>
        <label><input type="checkbox" id="chk-mark2"> แสดง cam2 marker</label>
        <label><input type="checkbox" id="chk-mesh1" checked> แสดง mesh cam1</label>
        <label><input type="checkbox" id="chk-cloud1"> แสดง cloud cam1</label>
        <label><input type="checkbox" id="chk-mesh2" checked> แสดง mesh cam2</label>
        <label><input type="checkbox" id="chk-cloud2"> แสดง cloud cam2</label>
    </div>

    <button id="btn-panels" type="button">⚙ Tune</button>

    <script>
        // Check view/display mode from URL query (?mode=display or ?display=1)
        const urlParams = new URLSearchParams(window.location.search);
        const isDisplayOnly = urlParams.get('mode') === 'display' || urlParams.has('display') || urlParams.has('minimal') || urlParams.has('viewonly');
        if (isDisplayOnly) {
            document.body.classList.add('display-only');
        }

        // ===== 1. Scene, Camera, Renderer =====
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f5f5);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(1.8, 1.8, 2.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.localClippingEnabled = true;
        container.appendChild(renderer.domElement);
        const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0.0);

        const cameraControls = new THREE.OrbitControls(camera, renderer.domElement);
        cameraControls.enableDamping = true;
        cameraControls.dampingFactor = 0.05;
        cameraControls.target.set(0, 0.4, 0);

        // Lighting
        scene.add(new THREE.HemisphereLight(0xffffff, 0xd8e0ea, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(3, 6, 4);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(2048, 2048);
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 20;
        dirLight.shadow.camera.left = -2;
        dirLight.shadow.camera.right = 2;
        dirLight.shadow.camera.top = 2;
        dirLight.shadow.camera.bottom = -2;
        dirLight.shadow.bias = -0.0005;
        dirLight.shadow.radius = 3;
        scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0xcfe0ff, 0.5);
        fillLight.position.set(-4, 3, -3);
        scene.add(fillLight);

        const pmrem = new THREE.PMREMGenerator(renderer);
        const envCanvas = document.createElement('canvas');
        envCanvas.width = 256; envCanvas.height = 128;
        const envCtx = envCanvas.getContext('2d');
        const envGrad = envCtx.createLinearGradient(0, 0, 0, 128);
        envGrad.addColorStop(0.0, '#ffffff');
        envGrad.addColorStop(0.5, '#eaeff5');
        envGrad.addColorStop(1.0, '#b6c1cc');
        envCtx.fillStyle = envGrad;
        envCtx.fillRect(0, 0, 256, 128);
        const envTex = new THREE.CanvasTexture(envCanvas);
        envTex.mapping = THREE.EquirectangularReflectionMapping;
        scene.environment = pmrem.fromEquirectangular(envTex).texture;
        envTex.dispose();
        pmrem.dispose();

        // Grid + soft shadow catcher
        const gridHelper = new THREE.GridHelper(3, 15, 0xbbbbbb, 0xdddddd);
        scene.add(gridHelper);
        const axesHelper = new THREE.AxesHelper(0.4);
        scene.add(axesHelper);
        const shadowPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(6, 6),
            new THREE.ShadowMaterial({ opacity: 0.22 }));
        shadowPlane.rotation.x = -Math.PI / 2;
        shadowPlane.receiveShadow = true;
        scene.add(shadowPlane);

        // ===== Camera Feed Ground Plane =====
        const camCanvas = document.createElement('canvas');
        camCanvas.width = 640;
        camCanvas.height = 360;
        const camCtx = camCanvas.getContext('2d');
        const camTexture = new THREE.CanvasTexture(camCanvas);
        camTexture.minFilter = THREE.LinearFilter;
        camTexture.magFilter = THREE.LinearFilter;

        const cam2Canvas = document.createElement('canvas');
        cam2Canvas.width = 640;
        cam2Canvas.height = 360;
        const cam2Ctx = cam2Canvas.getContext('2d');
        const cam2Texture = new THREE.CanvasTexture(cam2Canvas);
        cam2Texture.minFilter = THREE.LinearFilter;
        cam2Texture.magFilter = THREE.LinearFilter;

        const depthCanvas = document.createElement('canvas');
        depthCanvas.width = 160;
        depthCanvas.height = 90;
        const depthCtx = depthCanvas.getContext('2d');
        const depthTexture = new THREE.CanvasTexture(depthCanvas);
        depthTexture.minFilter = THREE.LinearFilter;
        depthTexture.magFilter = THREE.LinearFilter;

        function readDepthFrame() {
            const token = localStorage.getItem('access_token') || '';
            if (!token) { setTimeout(readDepthFrame, 2000); return; }
            fetch('/api/map/depth_frame?_t=' + Date.now(), {
                headers: { Authorization: 'Bearer ' + token },
                cache: 'no-store',
            }).then((res) => { if (!res.ok) throw 0; return res.blob(); })
                .then((blob) => createImageBitmap(blob))
                .then((bmp) => {
                    depthCtx.drawImage(bmp, 0, 0, depthCanvas.width, depthCanvas.height);
                    bmp.close();
                    depthTexture.needsUpdate = true;
                })
                .catch(() => { })
                .finally(() => { setTimeout(readDepthFrame, 120); });
        }
        readDepthFrame();

        function findSeq(buf, seq, from) {
            const n = seq.length;
            for (let i = from; i <= buf.length - n; i++) {
                let ok = true;
                for (let j = 0; j < n; j++) { if (buf[i + j] !== seq[j]) { ok = false; break; } }
                if (ok) return i;
            }
            return -1;
        }

        function catBuf(a, b) {
            if (a.length === 0) return b;
            const out = new Uint8Array(a.length + b.length);
            out.set(a, 0); out.set(b, a.length);
            return out;
        }

        function drawJpeg(jpeg) {
            createImageBitmap(new Blob([jpeg], { type: 'image/jpeg' })).then((bmp) => {
                if (camCanvas.width !== bmp.width || camCanvas.height !== bmp.height) {
                    camCanvas.width = bmp.width; camCanvas.height = bmp.height;
                }
                camCtx.drawImage(bmp, 0, 0);
                bmp.close();
                camTexture.needsUpdate = true;
            }).catch(() => { });
        }

        function readCamStream() {
            const token = localStorage.getItem('access_token') || '';
            if (!token) { setTimeout(readCamStream, 2000); return; }
            fetch('/api/map/video_feed?_t=' + Date.now(), {
                headers: { Authorization: 'Bearer ' + token },
                cache: 'no-store',
            }).then((res) => {
                if (!res.ok || !res.body) throw new Error('stream ' + res.status);
                const reader = res.body.getReader();
                let buf = new Uint8Array(0);
                const pump = () => reader.read().then(({ value, done }) => {
                    if (done) return;
                    buf = catBuf(buf, value);
                    let pos = 0;
                    for (; ;) {
                        const soi = findSeq(buf, [0xff, 0xd8], pos);
                        if (soi < 0) { pos = Math.max(0, buf.length - 1); break; }
                        const eoi = findSeq(buf, [0xff, 0xd9], soi + 2);
                        if (eoi < 0) { pos = soi; break; }
                        drawJpeg(buf.slice(soi, eoi + 2));
                        pos = eoi + 2;
                    }
                    buf = buf.slice(pos);
                    return pump();
                });
                return pump();
            }).catch(() => { setTimeout(readCamStream, 1000); });
        }
        readCamStream();

        function drawJpeg2(jpeg) {
            createImageBitmap(new Blob([jpeg], { type: 'image/jpeg' })).then((bmp) => {
                if (cam2Canvas.width !== bmp.width || cam2Canvas.height !== bmp.height) {
                    cam2Canvas.width = bmp.width; cam2Canvas.height = bmp.height;
                }
                cam2Ctx.drawImage(bmp, 0, 0);
                bmp.close();
                cam2Texture.needsUpdate = true;
            }).catch(() => { });
        }

        function readCam2Stream() {
            const token = localStorage.getItem('access_token') || '';
            if (!token) { setTimeout(readCam2Stream, 2000); return; }
            fetch('/api/camera/stream2?_t=' + Date.now(), {
                headers: { Authorization: 'Bearer ' + token },
                cache: 'no-store',
            }).then((res) => {
                if (!res.ok || !res.body) throw new Error('stream2 ' + res.status);
                const reader = res.body.getReader();
                let buf = new Uint8Array(0);
                const pump = () => reader.read().then(({ value, done }) => {
                    if (done) return;
                    buf = catBuf(buf, value);
                    let pos = 0;
                    for (; ;) {
                        const soi = findSeq(buf, [0xff, 0xd8], pos);
                        if (soi < 0) { pos = Math.max(0, buf.length - 1); break; }
                        const eoi = findSeq(buf, [0xff, 0xd9], soi + 2);
                        if (eoi < 0) { pos = soi; break; }
                        drawJpeg2(buf.slice(soi, eoi + 2));
                        pos = eoi + 2;
                    }
                    buf = buf.slice(pos);
                    return pump();
                });
                return pump();
            }).catch(() => { setTimeout(readCam2Stream, 1000); });
        }
        readCam2Stream();

        const texMatrix = new THREE.Matrix4();
        const FLIP_X = 0.0;
        const FLIP_Y = 0.0;
        const DISP_SCALE = 0.0;
        const DISP_REF = 0.22;
        const groundGeo = new THREE.PlaneGeometry(1.2, 0.68, 24, 24);
        const groundMat = new THREE.ShaderMaterial({
            uniforms: {
                map: { value: camTexture },
                depthMap: { value: depthTexture },
                texMatrix: { value: texMatrix },
                opacity: { value: 0.92 },
                flipX: { value: FLIP_X },
                flipY: { value: FLIP_Y },
                dispScale: { value: DISP_SCALE },
                dispRef: { value: DISP_REF },
            },
            vertexShader: [
                'uniform mat4 texMatrix;',
                'uniform sampler2D depthMap;',
                'uniform float dispScale;',
                'uniform float dispRef;',
                'varying vec4 vProj;',
                'void main() {',
                '  vProj = texMatrix * modelMatrix * vec4(position, 1.0);',
                '  vec4 p = vProj;',
                '  p.xyz /= p.w;',
                '  float d = dispRef;',
                '  if (p.x >= 0.0 && p.x <= 1.0 && p.y >= 0.0 && p.y <= 1.0) {',
                '    d = texture2D(depthMap, p.xy).r;',
                '  }',
                '  vec3 pos = position;',
                '  pos.z += (dispRef - d) * dispScale;',
                '  gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);',
                '}',
            ].join('\n'),
            fragmentShader: [
                'uniform sampler2D map;',
                'uniform float opacity;',
                'uniform float flipX;',
                'uniform float flipY;',
                'varying vec4 vProj;',
                'void main() {',
                '  vec4 pr = vProj;',
                '  pr.xyz /= pr.w;',
                '  vec2 uv = pr.xy;',
                '  if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) discard;',
                '  if (flipX > 0.5) uv.x = 1.0 - uv.x;',
                '  if (flipY > 0.5) uv.y = 1.0 - uv.y;',
                '  gl_FragColor = texture2D(map, uv);',
                '  gl_FragColor.a *= opacity;',
                '}',
            ].join('\n'),
            transparent: true,
            side: THREE.DoubleSide,
        });
        const groundPlane = new THREE.Mesh(groundGeo, groundMat);
        groundPlane.renderOrder = -1;

        // ===== 2. Robot Hierarchy =====
        const robotBase = new THREE.Group();
        const link1 = new THREE.Group();
        const link2 = new THREE.Group();
        const link3 = new THREE.Group();
        const link4 = new THREE.Group();
        const link5 = new THREE.Group();
        const link6 = new THREE.Group();

        scene.add(robotBase);
        robotBase.add(link1);
        link1.add(link2);
        link2.add(link3);
        link3.add(link4);
        link4.add(link5);
        link5.add(link6);

        link1.position.set(0, 0.15, 0);
        link2.position.set(0, 0, 0);
        link3.position.set(0, 0.43, 0);
        link4.position.set(0, 0.35, 0.1);
        link5.position.set(0, 0.1, 0);
        link6.position.set(0, 0, 0.1);

        // ===== 3. Load .dae Models =====
        const loader = new THREE.ColladaLoader();
        const deg = (d) => THREE.MathUtils.degToRad(d);

        let loadedCount = 0;
        const totalModels = 7;

        function onModelLoaded() {
            loadedCount++;
            if (loadedCount >= totalModels) {
                scene.traverse((o) => {
                    if (o.isMesh && o !== shadowPlane) {
                        o.castShadow = true;
                        o.receiveShadow = true;

                    if (ab.byteLength < 4) return;
                    const n = new DataView(ab).getUint32(0, true);
                    if (!n) return;
                    const count = Math.min(n, CAM2_MAX_PTS);
                    const mm = new Int16Array(ab, 4, count * 3);
                    const rgb = new Uint8Array(ab, 4 + n * 6, count * 3);
                    for (let i = 0; i < count; i++) {
                        const j = i * 3;
                        cam2Pos[j] = mm[j] / 1000.0;
                        cam2Pos[j + 1] = -mm[j + 1] / 1000.0;
                        cam2Pos[j + 2] = -mm[j + 2] / 1000.0;
                    }
                    setCloudColors(cam2Col, cam2Pos, count, rgb, effMode(2));
                    cam2Geo.setDrawRange(0, count);
                    cam2PosAttr.needsUpdate = true;
                    cam2ColAttr.needsUpdate = true;
                })
                .catch(() => { })
                .finally(() => { setTimeout(readPointCloud2, 400); });
        }

        function worldCloud(obj, localArr, count, stride) {
            obj.updateWorldMatrix(true, false);
            const m = obj.matrixWorld;
            const v = new THREE.Vector3();
            const out = [];
            for (let i = 0; i < count; i += stride) {
                v.set(localArr[i * 3], localArr[i * 3 + 1], localArr[i * 3 + 2]).applyMatrix4(m);
                out.push([v.x, v.y, v.z]);
            }
            return out;
        }

            const vals = {

                rx: deg(mount.rotation.x), ry: deg(mount.rotation.y), rz: deg(mount.rotation.z),
            };
            Object.keys(vals).forEach((id) => {
                const el = document.getElementById(prefix + id);
                if (!el) return;
                el.value = String(Math.round(vals[id] * 100) / 100);

        function trackArmStill() {
            const p = projectorMount.parent;
            if (!p) return;
            p.updateWorldMatrix(true, false);
            const a = p.matrixWorld.elements;
            const b = _lastParentWorld.elements;
            let moved = false;
            for (let i = 0; i < 16; i++) {
                if (Math.abs(a[i] - b[i]) > 1e-6) { moved = true; break; }
            }
            if (moved) {
                _lastParentMove = performance.now();
                _lastParentWorld.copy(p.matrixWorld);
            }
        }

        function matClose(m, ref, eps) {
            const a = m.elements;
            const b = ref.elements;
            for (let i = 0; i < 16; i++) {
                if (Math.abs(a[i] - b[i]) > eps) return false;
            }
            return true;

        function applyAlignTarget() {
            if (alignGoalP === null) return;
            projectorMount.position.lerp(alignGoalP, 0.08);
            projectorMount.quaternion.slerp(alignGoalQ, 0.08);
            projectorMount.updateMatrixWorld(true);
            const dp = projectorMount.position.distanceTo(alignGoalP);
            const dq = 1 - Math.abs(projectorMount.quaternion.dot(alignGoalQ));
            if (dp < 0.0005 && dq < 1e-6) {
                projectorMount.position.copy(alignGoalP);
                projectorMount.quaternion.copy(alignGoalQ);
                projectorMount.updateMatrixWorld(true);
                alignGoalP = null;
                alignGoalQ = null;
                syncMountSliders(projectorMount, 'mt-');
            }
        }
        function runIcpAlign(silent) {
            if (icpBusy) return;
            if (performance.now() - _lastParentMove < ARM_STILL_MS) return;
            const token = localStorage.getItem('access_token') || '';
            if (!token) return;
            const n1 = cloudGeo.drawRange.count | 0;
            const n2 = cam2Geo.drawRange.count | 0;
            if (!n1 || !n2) { if (!silent) alert('point cloud not ready yet'); return; }
            const s1 = Math.max(1, Math.floor(n1 / 1500));
            const s2 = Math.max(1, Math.floor(n2 / 1500));
            const source = worldCloud(depthPoints, cloudPos, n1, s1);
            const target = worldCloud(cam2Points, cam2Pos, n2, s2);
            const parentAtSend = new THREE.Matrix4();
            if (projectorMount.parent) {
                projectorMount.parent.updateWorldMatrix(true, false);
                parentAtSend.copy(projectorMount.parent.matrixWorld);
            }
            icpBusy = true;
            fetch('/api/map/align_icp', {
                method: 'POST',
                headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ source, target, iters: 20 }),
            }).then((r) => (r.ok ? r.json() : null))
                .then((data) => {
                    if (!data || !data.ok) {
                        if (!silent) alert('ICP: ' + ((data && data.error) || 'failed'));
                        return;
                    }
                    if (data.fitness == null || data.fitness < 0.5 || data.rmse > 0.02) return;
                    if (projectorMount.parent) {
                        projectorMount.parent.updateWorldMatrix(true, false);
                        if (!matClose(projectorMount.parent.matrixWorld, parentAtSend, 1e-6)) return;
                    }
                    const T = new THREE.Matrix4().fromArray(data.transform);
                    const tLen = new THREE.Vector3().setFromMatrixPosition(T).length();
                    const tAng = 2 * Math.acos(Math.min(1, Math.abs(
                        new THREE.Quaternion().setFromRotationMatrix(T).w)));
                    if (tLen > 0.10 || tAng > 0.20) return;
                    projectorMount.updateWorldMatrix(true, false);
                    const parent = projectorMount.parent;
                    parent.updateWorldMatrix(true, false);
                    const m = new THREE.Matrix4().copy(parent.matrixWorld).invert();
                    m.multiply(T);
                    m.multiply(parent.matrixWorld);
                    m.multiply(projectorMount.matrix);
                    const p = new THREE.Vector3();
                    const q = new THREE.Quaternion();
                    const s = new THREE.Vector3();
                    m.decompose(p, q, s);
                    const dp = projectorMount.position.distanceTo(p);
                    const dq = 1 - Math.abs(projectorMount.quaternion.dot(q));
                    if (dp < 0.008 && dq < 2e-4) {
                        alignStable++;
                        if (alignStable >= 3) {
                            alignStable = 0;
                            if (autoChk && autoChk.checked) autoChk.checked = false;
                            setAuto(false);
                        }
                        return;
                    }
                    alignStable = 0;
                    if (alignGoalP === null) {
                        alignGoalP = p.clone();
                        alignGoalQ = q.clone();
                    } else {
                        alignGoalP.lerp(p, 0.4);
                        alignGoalQ.slerp(q, 0.4);
                    }
                })
                .catch(() => { if (!silent) alert('ICP request failed'); })
                .finally(() => { icpBusy = false; });
        }

        // Orange target sphere (draggable)
        const targetMesh = new THREE.Mesh(

        let transformControls = null;

        // ── 5. Unified End-Effector Gizmo: XYZ Move + Curved Arrows for J4/J5 ──
        // Container group for curved rotation arrows (J4 Red, J5 Green)
        const curvedGizmoGroup = new THREE.Group();

        // Helper to construct a 3D curved rotation arrow (Torus arc + Cone arrowhead + invisible pick torus)
        function createCurvedArrow(radius, arcAngle, colorHex) {
            const group = new THREE.Group();
            const tubeRadius = 0.0075; // Thicker, richer line

            // 1. Visible Torus arc with 100% solid, bright vibrant color (no lighting shading)
            const torusGeo = new THREE.TorusGeometry(radius, tubeRadius, 20, 64, arcAngle);
            const mat = new THREE.MeshBasicMaterial({
                color: colorHex,
                depthTest: false,
                depthWrite: false,
            });
            const torusMesh = new THREE.Mesh(torusGeo, mat);
            torusMesh.renderOrder = 999;
            group.add(torusMesh);

            // 2. Cone arrowhead at the end of the arc
            const coneRadius = tubeRadius * 2.8;
            const coneHeight = 0.028;
            const coneGeo = new THREE.ConeGeometry(coneRadius, coneHeight, 20);
            // Tangent at arcAngle: (-sin, cos, 0)
            const tangent = new THREE.Vector3(-Math.sin(arcAngle), Math.cos(arcAngle), 0).normalize();
            const coneMat = new THREE.MeshBasicMaterial({
                color: colorHex,
                depthTest: false,
                depthWrite: false,
            });
            const coneMesh = new THREE.Mesh(coneGeo, coneMat);
            coneMesh.renderOrder = 999;
            coneMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tangent);
            coneMesh.position.set(radius * Math.cos(arcAngle), radius * Math.sin(arcAngle), 0);
            group.add(coneMesh);

            // 3. Invisible thick hit mesh for easy mouse raycasting
            const hitGeo = new THREE.TorusGeometry(radius, 0.026, 8, 32, arcAngle);
            const hitMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
            const hitMesh = new THREE.Mesh(hitGeo, hitMat);
            group.add(hitMesh);

            return { group, torusMesh, coneMesh, hitMesh, mat, coneMat };
        }

        // Red curved arrow for J4 (Pitch/Tilt) - radius 0.105m, vivid scarlet red
        const j4ArrowData = createCurvedArrow(0.105, Math.PI * 0.78, 0xff0044);
        const j4ArrowGroup = j4ArrowData.group;
        const j4HitMesh = j4ArrowData.hitMesh;
        const j4Mat = j4ArrowData.mat;
        const j4ConeMat = j4ArrowData.coneMat;
        curvedGizmoGroup.add(j4ArrowGroup);

        // Green curved arrow for J5 (Roll/Yaw) - radius 0.125m, vivid emerald green
        const j5ArrowData = createCurvedArrow(0.125, Math.PI * 0.78, 0x00e676);
        const j5ArrowGroup = j5ArrowData.group;
        const j5HitMesh = j5ArrowData.hitMesh;
        const j5Mat = j5ArrowData.mat;
        const j5ConeMat = j5ArrowData.coneMat;
        curvedGizmoGroup.add(j5ArrowGroup);

        const _q4Tmp = new THREE.Quaternion();
        const _q5Tmp = new THREE.Quaternion();
        const _zAxis4 = new THREE.Vector3();
        const _yAxis5 = new THREE.Vector3();
        const _unitZ = new THREE.Vector3(0, 0, 1);

        function _updateCurvedArrows() {
            if (isDisplayOnly || !curvedGizmoGroup) return;

            // Follow targetMesh position (center of XYZ gizmo)
            targetMesh.getWorldPosition(curvedGizmoGroup.position);

            // J4 (Red): normal is link4's local Z axis transformed to world space
            link4.getWorldQuaternion(_q4Tmp);
            _zAxis4.set(0, 0, 1).applyQuaternion(_q4Tmp).normalize();
            j4ArrowGroup.quaternion.setFromUnitVectors(_unitZ, _zAxis4);

            // J5 (Green): normal is link5's local Y axis transformed to world space
            link5.getWorldQuaternion(_q5Tmp);
            _yAxis5.set(0, 1, 0).applyQuaternion(_q5Tmp).normalize();
            j5ArrowGroup.quaternion.setFromUnitVectors(_unitZ, _yAxis5);
        }

        let ikMode = false;
        let isDragging = false;
        let activeDragJoint = null;
        let dragStartAngle = 0;
        let dragStartPointerAngle = 0;
        const _centerScreenPx = new THREE.Vector2();
        const _tipWorldPos = new THREE.Vector3();
        const _tipNdc = new THREE.Vector3();
        const _curvedRaycaster = new THREE.Raycaster();
        const _curvedMouse = new THREE.Vector2();

        const _ttEl = document.getElementById('joint-tooltip');
        function _showJointTooltip(text, x, y) {
            if (!_ttEl) return;
            _ttEl.textContent = text;
            _ttEl.style.display = 'block';
            _ttEl.style.left = (x + 14) + 'px';
            _ttEl.style.top = (y + 14) + 'px';
        }
        function _hideJointTooltip() {
            if (_ttEl) _ttEl.style.display = 'none';
        }

        function _calcCenterScreenPx() {
            targetMesh.getWorldPosition(_tipWorldPos);
            _tipNdc.copy(_tipWorldPos).project(camera);
            const rect = renderer.domElement.getBoundingClientRect();
            _centerScreenPx.x = ((_tipNdc.x + 1) * 0.5) * rect.width + rect.left;
            _centerScreenPx.y = ((-_tipNdc.y + 1) * 0.5) * rect.height + rect.top;
        }

        function onCurvedPointerDown(e) {
            if (e.button !== 0 || isDisplayOnly) return;
            const rect = renderer.domElement.getBoundingClientRect();
            _curvedMouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            _curvedMouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            _curvedRaycaster.setFromCamera(_curvedMouse, camera);
            const hits = _curvedRaycaster.intersectObjects([j4HitMesh, j5HitMesh], false);
            if (hits.length > 0) {
                const hitObj = hits[0].object;
                activeDragJoint = (hitObj === j4HitMesh) ? 'j4' : 'j5';
                cameraControls.enabled = false;
                if (transformControls) transformControls.enabled = false;

                _calcCenterScreenPx();
                dragStartPointerAngle = Math.atan2(e.clientY - _centerScreenPx.y, e.clientX - _centerScreenPx.x);
                dragStartAngle = (activeDragJoint === 'j4') ? link4.rotation.z : link5.rotation.y;

                renderer.domElement.style.cursor = 'grabbing';
                window.parent.postMessage({ type: 'gizmoDragStart' }, '*');

                e.stopImmediatePropagation();
                e.preventDefault();
            }
        }

        function onCurvedPointerMove(e) {
            if (activeDragJoint) {
                const curAngle = Math.atan2(e.clientY - _centerScreenPx.y, e.clientX - _centerScreenPx.x);
                let delta = curAngle - dragStartPointerAngle;
                while (delta > Math.PI) delta -= Math.PI * 2;
                while (delta < -Math.PI) delta += Math.PI * 2;

                const camDir = new THREE.Vector3();
                camera.getWorldDirection(camDir);

                if (activeDragJoint === 'j4') {
                    link4.getWorldQuaternion(_q4Tmp);
                    _zAxis4.set(0, 0, 1).applyQuaternion(_q4Tmp).normalize();
                    const sign = (_zAxis4.dot(camDir) > 0) ? -1 : 1;
                    const { min, max } = ikJoints[3];
                    const nextAng = THREE.MathUtils.clamp(dragStartAngle + delta * sign, min, max);
                    link4.rotation.z = nextAng;
                    link4.rotation.x = 0; link4.rotation.y = 0;
                    link4.updateMatrixWorld(true);

                    const degVal = THREE.MathUtils.radToDeg(nextAng).toFixed(1);
                    _showJointTooltip(`J4 (แดง): ${degVal}°`, e.clientX, e.clientY);
                } else if (activeDragJoint === 'j5') {
                    link5.getWorldQuaternion(_q5Tmp);
                    _yAxis5.set(0, 1, 0).applyQuaternion(_q5Tmp).normalize();
                    const sign = (_yAxis5.dot(camDir) > 0) ? -1 : 1;
                    const { min, max } = ikJoints[4];
                    const nextAng = THREE.MathUtils.clamp(dragStartAngle + delta * sign, min, max);
                    link5.rotation.y = nextAng;
                    link5.rotation.x = 0; link5.rotation.z = 0;
                    link5.updateMatrixWorld(true);

                    const degVal = THREE.MathUtils.radToDeg(nextAng).toFixed(1);
                    _showJointTooltip(`J5 (เขียว): ${degVal}°`, e.clientX, e.clientY);
                }

                // Snap targetMesh position to new end-effector tip position
                endEffector.getWorldPosition(targetMesh.position);
                targetMesh.updateMatrixWorld(true);
                if (transformControls) transformControls.updateMatrixWorld();

                _updateCurvedArrows();
                _postTargetPose();
                e.preventDefault();
                return;
            }

            if (isDisplayOnly) return;
            const rect = renderer.domElement.getBoundingClientRect();
            _curvedMouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            _curvedMouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            _curvedRaycaster.setFromCamera(_curvedMouse, camera);
            const hits = _curvedRaycaster.intersectObjects([j4HitMesh, j5HitMesh], false);
            if (hits.length > 0) {
                const hitObj = hits[0].object;
                if (hitObj === j4HitMesh) {
                    j4Mat.color.setHex(0xff5277);
                    j4ConeMat.color.setHex(0xff5277);
                    j5Mat.color.setHex(0x00e676);
                    j5ConeMat.color.setHex(0x00e676);
                    renderer.domElement.style.cursor = 'grab';
                    const deg = THREE.MathUtils.radToDeg(link4.rotation.z).toFixed(1);
                    _showJointTooltip(`หมุน J4: ${deg}°`, e.clientX, e.clientY);
                } else {
                    j5Mat.color.setHex(0x69f0ae);
                    j5ConeMat.color.setHex(0x69f0ae);
                    j4Mat.color.setHex(0xff0044);
                    j4ConeMat.color.setHex(0xff0044);
                    renderer.domElement.style.cursor = 'grab';
                    const deg = THREE.MathUtils.radToDeg(link5.rotation.y).toFixed(1);
                    _showJointTooltip(`หมุน J5: ${deg}°`, e.clientX, e.clientY);
                }
            } else {
                j4Mat.color.setHex(0xff0044);
                j4ConeMat.color.setHex(0xff0044);
                j5Mat.color.setHex(0x00e676);
                j5ConeMat.color.setHex(0x00e676);
                _hideJointTooltip();
                if (!transformControls || !transformControls.dragging) {
                    renderer.domElement.style.cursor = '';
                }
            }
        }

        function onCurvedPointerUp(e) {
            if (activeDragJoint) {
                activeDragJoint = null;
                cameraControls.enabled = true;
                if (transformControls) transformControls.enabled = true;
                renderer.domElement.style.cursor = '';
                _hideJointTooltip();
                syncTargetToTip();
                _updateCurvedArrows();
                _postTargetPose();
            }
        }

        if (!isDisplayOnly) {
            // Position sphere at end-effector
            scene.add(targetMesh);

            // ── Main TransformControls (translate IK for J1-J3) ──
            transformControls = new THREE.TransformControls(camera, renderer.domElement);
            transformControls.setMode('translate');
            transformControls.setSize(0.75);
            transformControls.attach(targetMesh);
            scene.add(transformControls);

            transformControls.addEventListener('dragging-changed', (e) => {
                cameraControls.enabled = !e.value;
                isDragging = e.value;
                if (e.value) {
                    ikMode = true;
                    window.parent.postMessage({ type: 'gizmoDragStart' }, '*');
                } else {
                    ikMode = false;
                    _postTargetPose();
                    _updateCurvedArrows();
                }
            });

            transformControls.addEventListener('change', () => {
                if (!transformControls.dragging) return;
                // CCD IK toward targetMesh position (solves J1..J3 only)
                solveIK(targetMesh.position);
                _updateCurvedArrows();
            });

            // Pointer event listeners on canvas for the curved rotation arrows
            const dom = renderer.domElement;
            dom.addEventListener('pointerdown', onCurvedPointerDown, true);
            window.addEventListener('pointermove', onCurvedPointerMove, { passive: false });
            window.addEventListener('pointerup', onCurvedPointerUp, { passive: false });
            window.addEventListener('pointercancel', onCurvedPointerUp, { passive: false });

            // Toolbar buttons
            const bs = document.getElementById('btn-snap');
            if (bs) bs.addEventListener('click', handleSnap);
            const btnClearGhost = document.getElementById('btn-clear-ghost');
            if (btnClearGhost) btnClearGhost.addEventListener('click', clearAllGhosts);

            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.key === 'r' || e.key === 'R') handleSnap();
                if (e.key === 'c' || e.key === 'C') clearAllGhosts();
            });
        }

        // ===== 5. CCD Inverse Kinematics =====
        // Matches joint hierarchy of Dobot CR5 (J1..J6)
        const ikJoints = [
            { seg: link1, axis: 'y', min: deg(-180), max: deg(180), weight: 1.0 },
            { seg: link2, axis: 'z', min: deg(-90), max: deg(90), weight: 1.0 },
            { seg: link3, axis: 'z', min: deg(-150), max: deg(150), weight: 1.0 },
            { seg: link4, axis: 'z', min: deg(-180), max: deg(180), weight: 0.9 },
            { seg: link5, axis: 'y', min: deg(-180), max: deg(180), weight: 0.8 },
            { seg: link6, axis: 'z', min: deg(-180), max: deg(180), weight: 0.7 },
        ];

        const _effPos = new THREE.Vector3();
        const _jointPos = new THREE.Vector3();
        const _parentQ = new THREE.Quaternion();
        const _worldAxis = new THREE.Vector3();
        const _toEff = new THREE.Vector3();
        const _toTarget = new THREE.Vector3();
        const _effProj = new THREE.Vector3();
        const _targetProj = new THREE.Vector3();
        const _cross = new THREE.Vector3();

        function _ccdStep(seg, axis, min, max, weight, target, TOLERANCE, DAMPING) {
            endEffector.getWorldPosition(_effPos);
            if (_effPos.distanceTo(target) < TOLERANCE) return false;
            seg.getWorldPosition(_jointPos);
            _toEff.subVectors(_effPos, _jointPos);
            _toTarget.subVectors(target, _jointPos);
            const localAxis = axis === 'x' ? new THREE.Vector3(1, 0, 0)
                : axis === 'y' ? new THREE.Vector3(0, 1, 0)
                    : new THREE.Vector3(0, 0, 1);
            if (seg.parent) seg.parent.getWorldQuaternion(_parentQ);
            else _parentQ.identity();
            _worldAxis.copy(localAxis).applyQuaternion(_parentQ).normalize();
            const effDot = _toEff.dot(_worldAxis);
            const targetDot = _toTarget.dot(_worldAxis);
            _effProj.copy(_toEff).addScaledVector(_worldAxis, -effDot);
            _targetProj.copy(_toTarget).addScaledVector(_worldAxis, -targetDot);
            const effLen = _effProj.length();
            const targetLen = _targetProj.length();
            if (effLen < 0.001 || targetLen < 0.001) return true;
            _effProj.divideScalar(effLen);
            _targetProj.divideScalar(targetLen);
            const dot = THREE.MathUtils.clamp(_effProj.dot(_targetProj), -1, 1);
            let angle = Math.acos(dot) * DAMPING * (weight || 1.0);
            _cross.crossVectors(_effProj, _targetProj);
            if (_cross.dot(_worldAxis) < 0) angle = -angle;
            if (Math.abs(angle) > 0.0001) {
                const curAngle = seg.rotation[axis];
                const nextAngle = THREE.MathUtils.clamp(curAngle + angle, min, max);
                seg.rotation[axis] = nextAngle;
                if (axis !== 'x') seg.rotation.x = 0;
                if (axis !== 'y') seg.rotation.y = 0;
                if (axis !== 'z') seg.rotation.z = 0;
                seg.updateMatrixWorld(true);
            }
            return true;
        }

        function solveIK(targetPos) {
            // Solve using ONLY J1..J3 (base + arm). J4, J5, J6 remain fixed during IK Move XYZ
            // to prevent the 3D wrist model from breaking or twisting unnaturally.
            // J4 and J5 are rotated separately in 'Wrist J4/J5' mode (shortcut E).
            const IK_ARM_JOINTS = 3; // J1 (0), J2 (1), J3 (2)
            const ITERATIONS = 35;
            const TOLERANCE = 0.0015;
            const DAMPING = 0.70;
            for (let iter = 0; iter < ITERATIONS; iter++) {
                endEffector.getWorldPosition(_effPos);
                if (_effPos.distanceTo(targetPos) < TOLERANCE) break;
                for (let i = IK_ARM_JOINTS - 1; i >= 0; i--) {
                    const { seg, axis, min, max, weight } = ikJoints[i];
                    _ccdStep(seg, axis, min, max, weight, targetPos, TOLERANCE, DAMPING);
                }
            }
        }

        // (solveIKWithOrientation removed — wrist is now handled by wristControls delta)

        // Sync target sphere to end-effector tip on first load / drag release
        function syncTargetToTip() {
            if (isDisplayOnly) return;
            const p = new THREE.Vector3();
            endEffector.getWorldPosition(p);
            targetMesh.position.copy(p);
            endEffector.getWorldQuaternion(targetMesh.quaternion);
            targetMesh.updateMatrixWorld(true);
            if (transformControls) transformControls.updateMatrixWorld();
            ikMode = false;
            _updateCurvedArrows();
        }

        // ── Send current target pose to parent React app ──
        const _rad2degFn = THREE.MathUtils.radToDeg;
        const _tpEuler = new THREE.Euler();
        const _tpQuat = new THREE.Quaternion();

        function _postTargetPose() {
            endEffector.getWorldPosition(_tcpPos);
            endEffector.getWorldQuaternion(_tpQuat);
            _tpEuler.setFromQuaternion(_tpQuat);

            const safeCoord = (val, fb = 0) => {
                const n = Number(val);
                return (!isNaN(n) && isFinite(n)) ? +n.toFixed(1) : fb;
            };

            const mmX = safeCoord(_tcpPos.x * 1000);
            const mmY = safeCoord(_tcpPos.y * 1000);
            const mmZ = safeCoord(_tcpPos.z * 1000);
            const rx = safeCoord(_rad2degFn(_tpEuler.x));
            const ry = safeCoord(_rad2degFn(_tpEuler.y));
            const rz = safeCoord(_rad2degFn(_tpEuler.z));

            const joints = [
                safeCoord(_rad2degFn(link1.rotation.y)),
                safeCoord(_rad2degFn(link2.rotation.z)),
                safeCoord(_rad2degFn(link3.rotation.z)),
                safeCoord(_rad2degFn(link4.rotation.z)),
                safeCoord(_rad2degFn(link5.rotation.y)),
                safeCoord(_rad2degFn(link6.rotation.z)),
            ];

            window.parent.postMessage({
                type: 'targetPoseUpdate',
                x: mmX, y: mmY, z: mmZ,
                rx, ry, rz,
                joints,
            }, '*');
        }

        // ===== Multiple Transparent Grey Ghosts (เงาสีเทาแบบโปร่ง ทำได้หลายรอบ) =====
        let ghostList = []; // Array of { id, index, group, tipMesh, joints, pose }
        let selectedGhostIndex = -1;
        const MAX_GHOSTS = 25;

        // Clean transparent slate-grey material (สีเทาแบบโปร่ง สบายตา มองเห็นโครงแขนกลชัดเจน)
        const ghostMat = new THREE.MeshStandardMaterial({
            color: 0x475569,          // Slate grey (#475569)
            roughness: 0.55,
            metalness: 0.1,
            transparent: true,
            opacity: 0.38,
            depthWrite: false,
            side: THREE.DoubleSide,
        });

        // Vibrant glowing cyan highlight material for selected ghost
        const ghostMatHighlight = new THREE.MeshStandardMaterial({
            color: 0x06b6d4,          // Cyan (#06b6d4)
            roughness: 0.3,
            metalness: 0.2,
            transparent: true,
            opacity: 0.72,
            depthWrite: false,
            side: THREE.DoubleSide,
        });

        function highlightGhost(targetIndex) {
            selectedGhostIndex = (typeof targetIndex === 'number' && targetIndex >= 0 && targetIndex < ghostList.length) ? targetIndex : -1;
            for (let i = 0; i < ghostList.length; i++) {
                const g = ghostList[i];
                if (!g || !g.group) continue;
                const isSelected = (i === selectedGhostIndex);
                const matToUse = isSelected ? ghostMatHighlight : ghostMat;
                g.group.traverse((child) => {
                    if (child.isMesh && child !== g.tipMesh) {
                        child.material = matToUse;
                    }
                });
                if (g.tipMesh && g.tipMesh.material) {
                    g.tipMesh.material.color.setHex(isSelected ? 0x06b6d4 : 0x334155);
                    g.tipMesh.material.opacity = isSelected ? 0.95 : 0.65;
                }
            }
        }

        function clearAllGhosts() {
            for (const g of ghostList) {
                if (g.group) scene.remove(g.group);
            }
            ghostList = [];
            selectedGhostIndex = -1;
            _updateGhostUI();
            _postGhostList();
            window.parent.postMessage({ type: 'ghostCleared' }, '*');
        }

        function removeLastGhost() {
            if (ghostList.length === 0) return;
            const last = ghostList.pop();
            if (last && last.group) scene.remove(last.group);
            if (selectedGhostIndex >= ghostList.length) {
                selectedGhostIndex = ghostList.length - 1;
            }
            highlightGhost(selectedGhostIndex);
            _updateGhostUI();
            _postGhostList();
        }

        function deleteGhost(targetIndex) {
            if (typeof targetIndex !== 'number' || targetIndex < 0 || targetIndex >= ghostList.length) return;
            const item = ghostList.splice(targetIndex, 1)[0];
            if (item && item.group) scene.remove(item.group);
            ghostList.forEach((g, idx) => { g.index = idx + 1; });
            if (selectedGhostIndex === targetIndex) {
                selectedGhostIndex = ghostList.length > 0 ? Math.min(targetIndex, ghostList.length - 1) : -1;
            } else if (selectedGhostIndex > targetIndex) {
                selectedGhostIndex--;
            }
            highlightGhost(selectedGhostIndex);
            _updateGhostUI();
            _postGhostList();
        }

        function _updateGhostUI() {
            const btnClear = document.getElementById('btn-clear-ghost');
            if (btnClear) {
                if (ghostList.length > 0) {
                    btnClear.style.display = 'flex';
                    btnClear.innerHTML = `ลบเงา (${ghostList.length}) <span class="kbd">C</span>`;
                } else {
                    btnClear.style.display = 'none';
                }
            }
        }

        function _postGhostList() {
            const cleanGhosts = ghostList.map(g => ({
                id: g.id,
                index: g.index,
                pose: g.pose,
                joints: g.joints,
            }));
            const cleanLatest = cleanGhosts.length > 0 ? cleanGhosts[cleanGhosts.length - 1] : null;
            try {
                window.parent.postMessage({
                    type: 'ghostListUpdate',
                    count: cleanGhosts.length,
                    selectedIndex: selectedGhostIndex,
                    ghosts: cleanGhosts,
                    latest: cleanLatest,
                }, '*');
            } catch (err) {
                console.error('Failed to post ghostListUpdate:', err);
            }
        }

        // Cache latest real robot pose & joints passed from parent
        let latestRealPose = null;
        let latestRealJoints = null;

        function captureGhostArm(customPose, customJoints) {
            if (loadedCount < totalModels) return;

            // Ensure transforms are up to date
            robotBase.updateMatrixWorld(true);

            // Clone full robot hierarchy
            const newGhost = robotBase.clone(true);

            // Apply transparent grey material and disable raycasting
            newGhost.traverse((child) => {
                if (child.isMesh) {
                    child.material = ghostMat;
                    child.castShadow = false;
                    child.receiveShadow = false;
                    child.raycast = () => { };
                }
            });

            // Save ghost joints (degrees): prioritize real robot joints
            let joints = customJoints || latestRealJoints;
            if (!joints || !Array.isArray(joints) || joints.length < 6) {
                joints = [
                    +_rad2degFn(link1.rotation.y).toFixed(2),
                    +_rad2degFn(link2.rotation.z).toFixed(2),
                    +_rad2degFn(link3.rotation.z).toFixed(2),
                    +_rad2degFn(link4.rotation.z).toFixed(2),
                    +_rad2degFn(link5.rotation.y).toFixed(2),
                    +_rad2degFn(link6.rotation.z).toFixed(2),
                ];
            } else {
                joints = joints.map(v => +Number(v).toFixed(2));
            }

            // Save ghost TCP pose: prioritize REAL robot coordinates!
            let pose = customPose || latestRealPose;
            const parseCoord = (obj, keyL, keyU, fallback = 0) => {
                if (!obj) return fallback;
                const v = obj[keyL] !== undefined ? obj[keyL] : obj[keyU];
                const n = Number(v);
                return (!isNaN(n) && isFinite(n)) ? +n.toFixed(1) : fallback;
            };

            const rawX = pose ? parseCoord(pose, 'x', 'X', null) : null;
            if (rawX === null) {
                endEffector.getWorldPosition(_tcpPos);
                endEffector.getWorldQuaternion(_tpQuat);
                _tpEuler.setFromQuaternion(_tpQuat);
                const safeNum = (v, fb = 0) => {
                    const n = Number(v);
                    return (!isNaN(n) && isFinite(n)) ? +n.toFixed(1) : fb;
                };
                pose = {
                    x: safeNum(_tcpPos.x * 1000),
                    y: safeNum(_tcpPos.y * 1000),
                    z: safeNum(_tcpPos.z * 1000),
                    rx: safeNum(_rad2degFn(_tpEuler.x)),
                    ry: safeNum(_rad2degFn(_tpEuler.y)),
                    rz: safeNum(_rad2degFn(_tpEuler.z)),
                };
            } else {
                endEffector.getWorldPosition(_tcpPos);
                const fallbackZ = (!isNaN(Number(_tcpPos.z)) && isFinite(Number(_tcpPos.z))) ? +(_tcpPos.z * 1000).toFixed(1) : 0;
                pose = {
                    x: rawX,
                    y: parseCoord(pose, 'y', 'Y', 0),
                    z: parseCoord(pose, 'z', 'Z', fallbackZ),
                    rx: parseCoord(pose, 'rx', 'RX', 0),
                    ry: parseCoord(pose, 'ry', 'RY', 0),
                    rz: parseCoord(pose, 'rz', 'RZ', 0),
                };
            }

            // Subtle dark-grey tip sphere marker
            const ghostTip = new THREE.Mesh(
                new THREE.SphereGeometry(0.015, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0x334155, transparent: true, opacity: 0.65 })
            );
            ghostTip.position.copy(_tcpPos);
            newGhost.add(ghostTip);

            scene.add(newGhost);

            // Append to list (supports multiple rounds!)
            const item = {
                id: Date.now() + '_' + (ghostList.length + 1),
                index: ghostList.length + 1,
                group: newGhost,
                tipMesh: ghostTip,
                joints,
                pose,
            };
            ghostList.push(item);

            // Cap maximum ghosts to prevent performance issues
            if (ghostList.length > MAX_GHOSTS) {
                const oldest = ghostList.shift();
                if (oldest && oldest.group) scene.remove(oldest.group);
            }

            selectedGhostIndex = ghostList.length - 1;
            highlightGhost(selectedGhostIndex);
            _updateGhostUI();
            _postGhostList();
        }

        function restoreGhostPose(targetIndex) {
            let target = null;
            let idx = -1;
            if (typeof targetIndex === 'number' && ghostList[targetIndex]) {
                target = ghostList[targetIndex];
                idx = targetIndex;
            } else if (ghostList.length > 0) {
                target = ghostList[ghostList.length - 1];
                idx = ghostList.length - 1;
            }
            if (!target || !target.joints) return;
            const j = target.joints;
            link1.rotation.y = deg(j[0]);
            link2.rotation.z = deg(j[1]);
            link3.rotation.z = deg(j[2]);
            link4.rotation.z = deg(j[3]);
            link5.rotation.y = deg(j[4]);
            link5.rotation.x = 0;
            link5.rotation.z = 0;
            link6.rotation.z = deg(j[5]);
            link6.rotation.x = 0;
            link6.rotation.y = 0;
            link1.updateMatrixWorld(true);
            syncTargetToTip();
            if (target.pose) {
                window.parent.postMessage({
                    type: 'targetPoseUpdate',
                    x: target.pose.x,
                    y: target.pose.y,
                    z: target.pose.z,
                    rx: target.pose.rx,
                    ry: target.pose.ry,
                    rz: target.pose.rz,
                    joints: target.joints,
                }, '*');
            } else {
                _postTargetPose();
            }
            highlightGhost(idx);
        }

        function selectGhost(targetIndex) {
            if (typeof targetIndex !== 'number' || targetIndex < 0 || targetIndex >= ghostList.length) {
                highlightGhost(-1);
                return;
            }
            restoreGhostPose(targetIndex);
        }

        function handleSnap(overridePose, overrideJoints) {
            // 1. Capture current arm as a new transparent grey ghost using real coordinates
            captureGhostArm(overridePose, overrideJoints);
            // 2. Snap Gizmo back to arm tip
            syncTargetToTip();
            // 3. Send target pose update
            const targetGhost = ghostList.length > 0 ? ghostList[ghostList.length - 1] : null;
            if (targetGhost && targetGhost.pose) {
                window.parent.postMessage({
                    type: 'targetPoseUpdate',
                    x: targetGhost.pose.x,
                    y: targetGhost.pose.y,
                    z: targetGhost.pose.z,
                    rx: targetGhost.pose.rx,
                    ry: targetGhost.pose.ry,
                    rz: targetGhost.pose.rz,
                    joints: targetGhost.joints,
                }, '*');
            } else {
                _postTargetPose();
            }
        }

        // ===== 6. Expose joint control & ghost control to parent React app via postMessage =====
        window.addEventListener('message', (e) => {
            if (!e.data) return;
            if (e.data.type === 'setJoints') {
                const j = e.data.joints; // array [j1..j6] in degrees
                if (!Array.isArray(j) || j.length < 6) return;
                if (e.data.realPose) latestRealPose = e.data.realPose;
                latestRealJoints = j.slice(0, 6);
                link1.rotation.y = deg(j[0]);
                link2.rotation.z = deg(j[1]);
                link3.rotation.z = deg(j[2]);
                link4.rotation.z = deg(j[3]);
                link5.rotation.y = deg(j[4]);
                link5.rotation.x = 0;
                link5.rotation.z = 0;
                link6.rotation.z = deg(j[5]);
                link6.rotation.x = 0;
                link6.rotation.y = 0;
                link1.updateMatrixWorld(true);
                ikMode = false;
                syncTargetToTip();
            } else if (e.data.type === 'snapGhost') {
                handleSnap(e.data.realPose, e.data.realJoints);
            } else if (e.data.type === 'clearGhost' || e.data.type === 'clearAllGhosts') {
                clearAllGhosts();
            } else if (e.data.type === 'removeLastGhost') {
                removeLastGhost();
            } else if (e.data.type === 'restoreGhost') {
                restoreGhostPose(e.data.index);
            } else if (e.data.type === 'selectGhost') {
                selectGhost(e.data.index);
            } else if (e.data.type === 'highlightGhost') {
                highlightGhost(e.data.index);
            } else if (e.data.type === 'deleteGhost') {
                deleteGhost(e.data.index);
            }
        });

        // Snap target to tip once after first render
        let firstFrame = true;

        // ===== 7. Render Loop =====
        // Cache TCP display elements
        const _tcpPos = new THREE.Vector3();
        const _tcpQuat = new THREE.Quaternion();
        const _tcpEuler = new THREE.Euler();
        const _rad2deg = THREE.MathUtils.radToDeg;
        let _lastPostMs = 0;

        function animate() {
            requestAnimationFrame(animate);
            cameraControls.update();

            if (firstFrame && loadedCount >= totalModels) {
                if (!isDisplayOnly) syncTargetToTip();
                firstFrame = false;
            }

            // Ring billboard & curved arrows follow gizmo
            if (!isDisplayOnly) {
                ring.lookAt(camera.position);
                _updateCurvedArrows();
            }

            // Read TCP position (metres → mm) and send to parent React app ~10x/sec
            endEffector.getWorldPosition(_tcpPos);
            const mmX = +(_tcpPos.x * 1000).toFixed(1);
            const mmY = +(_tcpPos.y * 1000).toFixed(1);
            const mmZ = +(_tcpPos.z * 1000).toFixed(1);

            const now = performance.now();
            if (now - _lastPostMs > 100) {
                _lastPostMs = now;

                // End-effector world orientation → Euler (degrees)
                endEffector.getWorldQuaternion(_tcpQuat);
                _tcpEuler.setFromQuaternion(_tcpQuat);
                const rx = +_rad2deg(_tcpEuler.x).toFixed(1);
                const ry = +_rad2deg(_tcpEuler.y).toFixed(1);
                const rz = +_rad2deg(_tcpEuler.z).toFixed(1);

                // Joint angles (degrees) from each link's rotation axis
                const joints = [
                    +_rad2deg(link1.rotation.y).toFixed(2),
                    +_rad2deg(link2.rotation.z).toFixed(2),
                    +_rad2deg(link3.rotation.z).toFixed(2),
                    +_rad2deg(link4.rotation.z).toFixed(2),
                    +_rad2deg(link5.rotation.y).toFixed(2),
                    +_rad2deg(link6.rotation.z).toFixed(2),
                ];

                window.parent.postMessage({
                    type: 'tcpUpdate',
                    x: mmX, y: mmY, z: mmZ,
                    rx, ry, rz,
                    joints,
                }, '*');
            }

            updateProjector();
            updateProjector2();
            trackArmStill();
            applyAlignTarget();
            cam2Mount.updateWorldMatrix(true, false);
            cam2Label.position.copy(cam2Mount.position);
            cam2Label.position.y += 0.18;
            cloudMatVideo.uniforms.sizeFactor.value = renderer.domElement.height;
            cam2MatVideo.uniforms.sizeFactor.value = renderer.domElement.height;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
    </script>
</body>

</html>
