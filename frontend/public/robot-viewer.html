<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Arm 3D Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #f5f5f5;
        }

        #canvas-container {
            width: 100%;
            height: 100vh;
        }

        #mount-tune,
        #cam2-tune {
            position: absolute;
            left: 12px;
            z-index: 45;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            font: 11px/1.5 system-ui, sans-serif;
            padding: 8px 10px;
            border-radius: 8px;
            display: none;
            flex-direction: column;
            gap: 3px;
        }

        #mount-tune {
            top: 12px;
        }

        #cam2-tune {
            top: 185px;
        }

        #mount-tune label,
        #cam2-tune label {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #mount-tune input[type=range],
        #cam2-tune input[type=range] {
            width: 96px;
        }

        #mount-tune .tune-num,
        #cam2-tune .tune-num {
            width: 62px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 4px;
            font: inherit;
            font-variant-numeric: tabular-nums;
            padding: 1px 4px;
            text-align: right;
        }

        #btn-icp {
            margin-top: 4px;
            padding: 4px 6px;
            border: 0;
            border-radius: 6px;
            background: #2b6cb0;
            color: #fff;
            font: inherit;
            cursor: pointer;
        }

        #btn-panels {
            position: absolute;
            bottom: 12px;
            right: 12px;
            z-index: 46;
            padding: 6px 10px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: transparent;
            font: 12px/1.4 system-ui, sans-serif;
            cursor: pointer;
        }

        #loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(245, 245, 245, 0.90);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #333;
            font-family: system-ui, sans-serif;
            font-size: 13px;
            z-index: 50;
            transition: opacity 0.4s ease;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top-color: #1a8fe3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #hint {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(8px);
            color: rgba(30, 41, 59, 0.9);
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 11px;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            pointer-events: none;
            white-space: normal;
            text-align: center;
            max-width: 90vw;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            z-index: 20;
        }

        #hint span {
            color: #0284c7;
            font-weight: 700;
        }

        /* ── Gizmo Mode Toolbar ── */
        #gizmo-toolbar {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            gap: 6px;
            z-index: 30;
            font-family: system-ui, -apple-system, sans-serif;
            flex-wrap: wrap;
        }

        .gizmo-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(8px);
            color: #1e293b;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
            transition: all 0.15s ease;
            user-select: none;
        }

        .gizmo-btn:hover {
            background: rgba(240, 248, 255, 0.95);
            border-color: #3b82f6;
            color: #1d4ed8;
        }

        .gizmo-btn.active {
            background: #1d4ed8;
            border-color: #1d4ed8;
            color: #fff;
            box-shadow: 0 2px 10px rgba(29, 78, 216, 0.4);
        }

        .gizmo-btn .kbd {
            font-size: 9px;
            padding: 1px 4px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.08);
            color: inherit;
            opacity: 0.7;
        }

        .gizmo-btn.active .kbd {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ── Gizmo Guide Badge ── */
        .gizmo-guide {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            color: #1e293b;
            font-size: 11px;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            user-select: none;
        }

        .guide-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 3px;
            vertical-align: middle;
        }

        .dot-xyz {
            background: #3b82f6;
            box-shadow: 0 0 5px #3b82f6;
        }

        .dot-j4 {
            background: #ef4444;
            box-shadow: 0 0 5px #ef4444;
        }

        .dot-j5 {
            background: #10b981;
            box-shadow: 0 0 5px #10b981;
        }

        .guide-sep {
            color: #cbd5e1;
            font-weight: 300;
        }

        /* Touch: make canvas fill properly on iPad */
        canvas {
            touch-action: none;
            display: block;
        }

        /* Display-only mode (for Drawing page): hides toolbar and hint */
        body.display-only #gizmo-toolbar,
        body.display-only #hint {
            display: none !important;
        }

        @media (max-width: 1024px) {
            #hint {
                font-size: 10px;
                padding: 5px 12px;
                bottom: 8px;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/ColladaLoader.js"></script>
</head>

<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <span>กำลังโหลดโมเดล...</span>
    </div>
    <!-- Gizmo Toolbar -->
    <div id="gizmo-toolbar">
    </div>

    <!-- Floating tooltip for joint angle during hover / drag -->
    <div id="joint-tooltip"
        style="position:fixed;display:none;pointer-events:none;z-index:9999;background:rgba(15,23,42,0.92);backdrop-filter:blur(6px);color:#fff;font:11px/1.4 system-ui,sans-serif;font-weight:600;padding:5px 9px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.18);">
    </div>

    <div id="canvas-container"></div>

    <div id="mount-tune">
        <div style="font-weight:600;margin-bottom:4px;font-size:11px;color:#9fd3ff;">Cam1 mount (flange → projector)
        </div>
        <label>X <input type="range" id="mt-px" min="-2" max="2" step="0.001" value="0.085"><input type="number"
                class="tune-num" id="mt-px-n" step="0.001" value="0.085"></label>
        <label>Y <input type="range" id="mt-py" min="-2" max="2" step="0.001" value="0.049"><input type="number"
                class="tune-num" id="mt-py-n" step="0.001" value="0.049"></label>
        <label>Z <input type="range" id="mt-pz" min="-2" max="2" step="0.001" value="-0.011"><input type="number"
                class="tune-num" id="mt-pz-n" step="0.001" value="-0.011"></label>
        <label>RotX <input type="range" id="mt-rx" min="-180" max="180" step="0.1" value="-178"><input type="number"
                class="tune-num" id="mt-rx-n" step="0.1" value="-178"></label>
        <label>RotY <input type="range" id="mt-ry" min="-180" max="180" step="0.1" value="0"><input type="number"
                class="tune-num" id="mt-ry-n" step="0.1" value="0"></label>
        <label>RotZ <input type="range" id="mt-rz" min="-180" max="180" step="0.1" value="180"><input type="number"
                class="tune-num" id="mt-rz-n" step="0.1" value="180"></label>
    </div>

    <div id="cam2-tune">
        <div style="font-weight:600;margin-bottom:4px;font-size:11px;color:#9fd3ff;">Cam2 extrinsic (base)</div>
        <label>X <input type="range" id="c2-px" min="-2" max="2" step="0.001" value="0.006"><input type="number"
                class="tune-num" id="c2-px-n" step="0.001" value="0.006"></label>
        <label>Y <input type="range" id="c2-py" min="-2" max="2" step="0.001" value="0.721"><input type="number"
                class="tune-num" id="c2-py-n" step="0.001" value="0.721"></label>
        <label>Z <input type="range" id="c2-pz" min="-2" max="2" step="0.001" value="0.812"><input type="number"
                class="tune-num" id="c2-pz-n" step="0.001" value="0.812"></label>
        <label>RotX <input type="range" id="c2-rx" min="-180" max="180" step="0.1" value="-74.3"><input type="number"
                class="tune-num" id="c2-rx-n" step="0.1" value="-74.3"></label>
        <label>RotY <input type="range" id="c2-ry" min="-180" max="180" step="0.1" value="0"><input type="number"
                class="tune-num" id="c2-ry-n" step="0.1" value="0"></label>
        <label>RotZ <input type="range" id="c2-rz" min="-180" max="180" step="0.1" value="0"><input type="number"
                class="tune-num" id="c2-rz-n" step="0.1" value="0"></label>
        <button id="btn-icp" type="button">Align (ICP)</button>
        <button id="btn-color" type="button">Color: Video</button>
        <label>พื้นที่ cam
            <select id="sel-area-cam">
                <option value="1" selected>cam1</option>
                <option value="2">cam2</option>
            </select>
        </label>
        <button id="btn-area" type="button">📐 วัดพื้นที่วัตถุ</button>
        <div id="area-result" style="font-size:10px;color:#9fd3ff;white-space:pre-line;max-width:220px;"></div>
        <div id="cam-pos" style="font-size:10px;color:#ffd28a;white-space:pre-line;max-width:220px;"></div>
        <div
            style="border-top:1px solid rgba(255,255,255,0.15);margin-top:5px;padding-top:5px;font-size:10px;color:#9fd3ff;">
            <div>Planar calibrate (depth-free)</div>
            <div style="display:flex;gap:4px;margin:3px 0;">
                <button id="btn-calib-refresh" type="button" style="font:inherit;">↻ ภาพ</button>
                <button id="btn-calib-reset" type="button" style="font:inherit;">reset</button>
            </div>
            <img id="calib-img" alt="คลิกจุดที่หุ่นแตะ"
                style="width:210px;height:auto;cursor:crosshair;border:1px solid rgba(255,255,255,0.25);background:#05070a;" />
            <div id="calib-status" style="white-space:pre-line;margin-top:2px;"></div>
            <div style="display:flex;gap:4px;margin-top:3px;">
                <button id="btn-bg" type="button" style="font:inherit;">📷 เก็บพื้นหลัง</button>
                <button id="btn-area-h" type="button" style="font:inherit;">📐 พื้นที่ (H)</button>
            </div>
            <div id="area-h-result" style="white-space:pre-line;color:#9fd3ff;"></div>
        </div>
        <label>3D mode
            <select id="sel-mode">
                <option value="auto" selected>Auto (ตามกล้อง)</option>
                <option value="rgb">RGB</option>
                <option value="gray">Gray</option>
                <option value="depth">Depth</option>
            </select>
        </label>
        <label><input type="checkbox" id="chk-auto" checked> Auto-align (ยึดตาม cam2)</label>
        <label><input type="checkbox" id="chk-mark1"> แสดง cam1 marker</label>
        <label><input type="checkbox" id="chk-mark2"> แสดง cam2 marker</label>
        <label>Tip ต่ำสุด (mm) <input type="number" id="tip-min-z" step="1" value="0"></label>

        <label><input type="checkbox" id="chk-mesh1" checked> แสดง mesh cam1</label>
        <label><input type="checkbox" id="chk-cloud1"> แสดง cloud cam1</label>
        <label><input type="checkbox" id="chk-mesh2" checked> แสดง mesh cam2</label>
        <label><input type="checkbox" id="chk-cloud2"> แสดง cloud cam2</label>
    </div>

    <div class="panel" id="scan-panel" style="margin-top:8px">
        <div style="font-weight:600;margin-bottom:6px">Scan &amp; Fuse</div>
        <label><input type="checkbox" id="chk-scanlive"> Live fused (2 กล้อง)</label>
        <div style="display:flex;gap:6px;margin:6px 0">
            <button type="button" id="btn-cap1">+ cam1</button>
            <button type="button" id="btn-cap2">+ cam2</button>
        </div>
        <div id="scan-count" style="font-size:12px;opacity:.8">views: 0</div>
        <div id="ext-status" style="font-size:11px;opacity:.8">cam2 extrinsic: —</div>
        <div style="display:flex;gap:6px;margin:6px 0">
            <button type="button" id="btn-fuse">Fuse</button>
            <button type="button" id="btn-save">Save</button>
            <button type="button" id="btn-clear">Clear</button>
        </div>
        <select id="sel-session" style="width:100%"></select>
        <button type="button" id="btn-load" style="width:100%;margin-top:6px">Load session</button>
    </div>

    <div style="display:flex;gap:6px;margin-top:8px">
        <button id="btn-panels" type="button">⚙ Tune</button>
        <button id="btn-tune-cam1" type="button">Cam1</button>
    </div>

    
    <script src="viewer-boot.js"></script>
    <script src="viewer-projector.js"></script>
    <script src="viewer-scan-align.js"></script>
    <script src="viewer-gizmo.js"></script>
    <script src="viewer-ik.js"></script>
    <script src="viewer-host-bridge.js"></script>
    <script src="viewer-loop.js"></script>

</body>

</html>
