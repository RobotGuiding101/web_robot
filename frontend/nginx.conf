server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Static assets — cache นาน
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # models/ (3D .dae files) — ไม่ cache เพื่อให้อัปเดตได้ง่าย
    location /models/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA fallback — ทุก route ที่ไม่ใช่ไฟล์จริงให้ส่ง index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # MJPEG streams — must NOT be buffered or mode changes lag/freeze
    location ~ ^/api/(map/video_feed|camera/stream)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        add_header X-Accel-Buffering no;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # proxy API calls ไปที่ backend container
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # proxy WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
