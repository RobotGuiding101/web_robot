# =============================================
# docker-compose.yml — Robot Arm Web System
# =============================================
# Usage:
#   docker compose up --build          # dev mode
#   docker compose up -d               # background
#   docker compose down                # stop

services:

  # ── PostgreSQL ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: robot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: robot_settings
      POSTGRES_USER: robot
      POSTGRES_PASSWORD: robot123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robot -d robot_settings"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend: FastAPI ────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: robot_backend
    restart: unless-stopped
    privileged: true
    network_mode: host
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://robot:robot123@127.0.0.1:5432/robot_settings
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend: React + Vite → nginx ──────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000}
    container_name: robot_frontend
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend

volumes:
  pgdata:

networks:
  default:
    name: robot_network
